name: YWE Repository Guardrails

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run existing repository checks
        run: |
          if [ -f scripts/run_checks.sh ]; then bash scripts/run_checks.sh; fi

      - name: Validate JSON files
        run: python scripts/check_json_integrity.py

      - name: Check required authority contracts
        run: python scripts/check_required_contracts.py

      - name: Check required Phase 8-9 artifacts
        run: python scripts/check_phase_8_9_required_artifacts.py

      - name: Scan for authority-stack drift
        run: python scripts/check_authority_stack.py --config data/validation/repository_drift_guardrail_rules.json

      - name: Check branch reality guardrail
        run: python scripts/check_branch_reality_guardrail.py

      - name: Check Phase 9 schema semantics
        run: python scripts/check_phase_9_schema_semantics.py

      - name: Check Phase 8-9 package boundary
        run: python scripts/check_phase_8_9_package_boundary.py

      - name: Check Phase 10 player runtime state
        run: python scripts/check_player_runtime_state.py

      - name: Check worldstate and location mutation
        run: python scripts/check_worldstate_location_mutation.py

      - name: Check quest, NPC, and lore generation
        run: python scripts/check_quest_npc_lore_generation.py

      - name: Check source-truth alignment
        run: python scripts/check_source_truth_alignment.py

      - name: Check repository attribution policy
        run: python scripts/check_repository_attribution_policy.py

      - name: Check non-destructive diff
        if: github.event_name == 'pull_request'
        run: python scripts/check_non_destructive_diff.py --base origin/${{ github.base_ref }} --head HEAD
