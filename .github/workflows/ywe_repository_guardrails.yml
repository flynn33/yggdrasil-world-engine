name: YWE Repository Guardrails

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Run phase and change-safety guardrails
        run: >-
          python3 scripts/validate_repository.py
          --group phase
          --group attribution
          --group change-safety
