name: M2 Baseline Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m2-baseline-repair.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Apply reviewed reconciliation
        shell: bash
        run: |
          cp .github/m2_baseline_repair.py /tmp/m2_baseline_repair.py
          rm .github/m2_baseline_repair.py .github/workflows/m2-baseline-repair.yml
          python /tmp/m2_baseline_repair.py .

      - name: Validate complete repository
        run: bash scripts/run_checks.sh --context push

      - name: Commit and push reviewed increment
        shell: bash
        run: |
          git config user.name "Jim Daley"
          git config user.email "94642455+flynn33@users.noreply.github.com"
          git add --all
          git commit -m "Reconcile repository validation baseline for M2"
          git push origin HEAD:main
