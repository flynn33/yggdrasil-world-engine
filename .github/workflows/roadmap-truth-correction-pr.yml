name: Publish Roadmap Truth Correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/roadmap-truth-correction-pr.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-roadmap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: flynn33/yggdrasil-world-engine
      CORRECTION_BRANCH: roadmap/m2-truth-correction
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Incorporate publication workflow removal into correction branch
        shell: bash
        run: |
          git config user.name "Jim Daley"
          git config user.email "94642455+flynn33@users.noreply.github.com"
          git fetch origin main "$CORRECTION_BRANCH"
          git checkout -B "$CORRECTION_BRANCH" "origin/$CORRECTION_BRANCH"
          git merge --no-edit origin/main
          git rm .github/workflows/roadmap-truth-correction-pr.yml
          git commit -m "Remove temporary roadmap publication workflow"
          git push origin "HEAD:refs/heads/$CORRECTION_BRANCH"

      - name: Open and merge correction pull request
        shell: bash
        run: |
          PR_URL="$(gh pr list --repo "$REPOSITORY" --head "$CORRECTION_BRANCH" --base main --state open --json url --jq '.[0].url')"
          if [[ -z "$PR_URL" ]]; then
            PR_URL="$(gh pr create \
              --repo "$REPOSITORY" \
              --head "$CORRECTION_BRANCH" \
              --base main \
              --title "Correct M2 roadmap and continuity state" \
              --body "Updates the roadmap and continuity records to match the verified repository state. Keeps M2 in progress and M3 planned; records 39 remaining unbound examples and the missing fixture catalog, M2 acceptance gate, and durable acceptance evidence; synchronizes governed status surfaces and continuity records; and removes temporary correction workflows. Validation completed before branch publication: roadmap governance passed, 255 tests passed, 29 canonical checks passed with zero blocking failures or advisories, and git diff --check passed.")"
          fi
          gh pr merge "$PR_URL" \
            --repo "$REPOSITORY" \
            --squash \
            --delete-branch \
            --subject "Correct M2 roadmap and continuity state" \
            --body "Roadmap and continuity records synchronized to verified M2 repository state."
