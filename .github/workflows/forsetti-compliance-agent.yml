name: Forsetti Compliance Agent

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forsetti-compliance:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Forsetti compliance
        shell: pwsh
        run: ./scripts/github/Test-ForsettiCompliance.ps1
