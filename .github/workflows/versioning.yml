name: Version Baseline & Changelog

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Baseline version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-bump:
    name: Update Repository Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current baseline
        id: current
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"

      - name: Calculate new baseline
        id: new
        run: |
          MAJOR=${{ steps.current.outputs.major }}
          MINOR=${{ steps.current.outputs.minor }}
          PATCH=${{ steps.current.outputs.patch }}
          BUMP=${{ inputs.bump }}

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Update synchronized version sources
        run: python3 scripts/update_version_references.py "${{ steps.new.outputs.version }}"

      - name: Generate changelog entry
        run: |
          NEW_VERSION="${{ steps.new.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          BASE_COMMIT=$(git log -1 --format=%H -- version.txt)
          RANGE="${BASE_COMMIT}..HEAD"
          ENTRY="## [${NEW_VERSION}] — ${DATE}"$'\n'$'\n'

          ADDED=$(git log ${RANGE} --pretty=format:"- %s" --grep="[Aa]dd" --grep="[Nn]ew" --grep="[Cc]reate" --grep="[Ii]mplement" | head -20)
          CHANGED=$(git log ${RANGE} --pretty=format:"- %s" --grep="[Uu]pdate" --grep="[Cc]hange" --grep="[Rr]efactor" --grep="[Ii]mprove" | head -20)
          FIXED=$(git log ${RANGE} --pretty=format:"- %s" --grep="[Ff]ix" --grep="[Bb]ug" --grep="[Rr]esolve" | head -20)

          if [ -z "$ADDED" ] && [ -z "$CHANGED" ] && [ -z "$FIXED" ]; then
            ALL=$(git log ${RANGE} --pretty=format:"- %s" | head -20)
            if [ -n "$ALL" ]; then
              ENTRY+="### Changes"$'\n'
              ENTRY+="${ALL}"$'\n'
            fi
          else
            if [ -n "$ADDED" ]; then
              ENTRY+="### Added"$'\n'
              ENTRY+="${ADDED}"$'\n'$'\n'
            fi
            if [ -n "$CHANGED" ]; then
              ENTRY+="### Changed"$'\n'
              ENTRY+="${CHANGED}"$'\n'$'\n'
            fi
            if [ -n "$FIXED" ]; then
              ENTRY+="### Fixed"$'\n'
              ENTRY+="${FIXED}"$'\n'$'\n'
            fi
          fi

          echo "$ENTRY" > /tmp/ywe_changelog_entry.md

      - name: Update changelog
        run: |
          {
            head -6 CHANGELOG.md
            echo ""
            cat /tmp/ywe_changelog_entry.md
            echo "---"
            echo ""
            tail -n +7 CHANGELOG.md
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Validate baseline update
        run: bash scripts/run_checks.sh --context manual

      - name: Commit baseline update branch
        run: |
          NEW_VERSION="${{ steps.new.outputs.version }}"
          BRANCH="baseline/v${NEW_VERSION}"
          git switch -c "$BRANCH"
          git add version.txt VERSION README.md CHANGELOG.md
          git add yggdrasil-instructions.json repository-contribution-policy.json
          git add data/governance/specification_roadmap.json
          git add docs/master_specification/README.md docs/glossary/README.md docs/governance/README.md
          git add docs/project/YWE_AGNOSTIC_SPECIFICATION_ROADMAP.md
          git commit -m "Update repository baseline to v${NEW_VERSION}"
          git push --set-upstream origin "$BRANCH"

      - name: Open baseline update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.new.outputs.version }}"
          gh pr create \
            --base main \
            --head "baseline/v${NEW_VERSION}" \
            --title "Update repository baseline to v${NEW_VERSION}" \
            --body "Updates synchronized repository baseline sources and the changelog. No publication is created."
