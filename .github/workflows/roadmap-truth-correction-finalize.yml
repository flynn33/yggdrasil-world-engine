name: Finalize Roadmap Truth Correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/roadmap-truth-correction-finalize.yml"

permissions:
  contents: write

jobs:
  finalize-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Apply reviewed correction and normalize Markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path('.github/workflows/roadmap-truth-correction.yml')
          lines = source_path.read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          program = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          exec(compile(program, str(source_path), 'exec'), {'__name__': '__main__'})

          for relative_path in (
              'docs/design-planning/Project_Record.md',
              'docs/design-planning/handoffs/2026-09-19-consumer-compatibility.md',
          ):
              path = Path(relative_path)
              normalized = '\n'.join(line.rstrip() for line in path.read_text(encoding='utf-8').splitlines()) + '\n'
              path.write_text(normalized, encoding='utf-8')

          Path('.github/workflows/roadmap-truth-correction-finalize.yml').unlink()
          PY

      - name: Validate corrected repository
        shell: bash
        run: |
          python scripts/check_specification_roadmap.py .
          bash scripts/run_checks.sh --context push
          git diff --check

      - name: Commit and push correction
        shell: bash
        run: |
          git config user.name "Jim Daley"
          git config user.email "94642455+flynn33@users.noreply.github.com"
          git add --all
          git commit -m "Correct M2 roadmap and continuity state"
          git push origin HEAD:main
