name: Install M2 Technical Package

on:
  push:
    branches:
      - m2/complete-canonical-contract-schema-foundation
    paths:
      - ".github/workflows/install-m2-technical-package.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: m2/complete-canonical-contract-schema-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Verify and install reviewed package
        shell: bash
        run: |
          cat .m2-package/part*.b64 | base64 --decode > /tmp/m2-package.tar.gz
          echo "b1409200253a0ac78540cb7df216d913c4c8381953c055ddf0d94e0b84cc0a2e  /tmp/m2-package.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/m2-package.tar.gz
          rm -rf .m2-package scripts/__pycache__ tests/__pycache__
          rm .github/workflows/install-m2-technical-package.yml

      - name: Integrate catalog with repository debt and checks
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          ROOT = Path(".")
          MACHINE = ROOT / "scripts/check_machine_readable_artifacts.py"
          BASELINE = ROOT / "data/validation/schema_quality_baseline.json"
          INVENTORY = ROOT / "data/validation/repository_quality_debt_inventory.json"
          CHECKS = ROOT / "data/validation/repository_checks.json"

          def load(path: Path):
              return json.loads(path.read_text(encoding="utf-8-sig"))

          def write(path: Path, value) -> None:
              path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          def normalized_sha256(path: Path) -> str:
              text = path.read_bytes().decode("utf-8-sig", errors="strict")
              data = text.replace("\r\n", "\n").replace("\r", "\n").encode("utf-8")
              return hashlib.sha256(data).hexdigest()

          text = MACHINE.read_text(encoding="utf-8")
          old = 'DEBT_PATH = "data/validation/schema_quality_baseline.json"\n'
          new = old + 'CATALOG_PATH = "data/validation/m2_fixture_catalog.json"\n'
          if old not in text or "CATALOG_PATH" in text:
              raise RuntimeError("machine-readable checker catalog constant precondition failed")
          text = text.replace(old, new, 1)

          old = '''def quality_debt(\n    schema_documents: dict[str, dict], json_documents: dict[str, object] | None = None\n) -> dict[str, list[str]]:\n    json_documents = json_documents or schema_documents\n    return {\n'''
          new = '''def catalog_bound_example_paths(json_documents: dict[str, object]) -> set[str]:\n    catalog = json_documents.get(CATALOG_PATH)\n    if not isinstance(catalog, dict) or not isinstance(catalog.get("entries"), list):\n        return set()\n    return {\n        entry.get("instance_path")\n        for entry in catalog["entries"]\n        if isinstance(entry, dict)\n        and isinstance(entry.get("instance_path"), str)\n        and entry.get("normative") is True\n    }\n\n\ndef quality_debt(\n    schema_documents: dict[str, dict], json_documents: dict[str, object] | None = None\n) -> dict[str, list[str]]:\n    json_documents = json_documents or schema_documents\n    bound_example_paths = catalog_bound_example_paths(json_documents)\n    return {\n'''
          if old not in text:
              raise RuntimeError("machine-readable checker function precondition failed")
          text = text.replace(old, new, 1)

          old = '''            if path.startswith("examples/")\n            and not (\n'''
          new = '''            if path.startswith("examples/")\n            and path not in bound_example_paths\n            and not (\n'''
          if old not in text:
              raise RuntimeError("machine-readable checker example predicate precondition failed")
          MACHINE.write_text(text.replace(old, new, 1), encoding="utf-8")

          baseline = load(BASELINE)
          for key in baseline["known_debt"]:
              baseline["known_debt"][key] = []
          write(BASELINE, baseline)

          inventory = load(INVENTORY)
          subledger = inventory["schema_debt_subledger"]
          subledger["sha256"] = normalized_sha256(BASELINE)
          subledger["category_occurrence_count"] = 0
          subledger["unique_path_count"] = 0
          for key in subledger["counts_by_category"]:
              subledger["counts_by_category"][key] = 0

          schema_debt = next(record for record in inventory["debts"] if record["debt_id"] == "QD-001")
          if schema_debt["status"] != "open":
              raise RuntimeError("QD-001 is not open before M2 technical closure")
          schema_debt["status"] = "resolved"
          schema_debt["resolution_evidence"] = [
              "data/validation/m2_fixture_catalog.json",
              "scripts/check_m2_acceptance.py",
              "tests/test_m2_acceptance.py",
              "examples/m2_contract_foundation/m2_common_contract_scenarios.json"
          ]

          statuses = Counter(record.get("status") for record in inventory["debts"])
          milestones = Counter(record.get("assigned_milestone") or "<missing>" for record in inventory["debts"])
          summary = inventory["summary"]
          summary["total"] = len(inventory["debts"])
          summary["open"] = statuses.get("open", 0)
          summary["resolved"] = statuses.get("resolved", 0)
          summary["accepted_exception"] = statuses.get("accepted_exception", 0)
          summary["by_milestone"] = dict(sorted(milestones.items()))
          write(INVENTORY, inventory)

          checks = load(CHECKS)
          if any(item.get("id") == "m2_acceptance" for item in checks["checks"]):
              raise RuntimeError("m2_acceptance check already registered")
          insertion = next(index for index, item in enumerate(checks["checks"]) if item["id"] == "non_destructive_diff")
          checks["checks"].insert(insertion, {
              "id": "m2_acceptance",
              "name": "M2 canonical contract and fixture acceptance",
              "command": ["{python}", "scripts/check_m2_acceptance.py", "{root}", "--preflight"],
              "groups": ["m2", "schema", "fixtures", "conformance", "traceability"],
              "roadmap_milestones": ["M2", "M3", "M10"],
              "contexts": ["always"],
              "blocking": True
          })
          write(CHECKS, checks)
          PY

      - name: Run bounded M2 technical preflight
        shell: bash
        run: |
          python scripts/check_m2_acceptance.py . --preflight
          python -m unittest tests.test_m2_acceptance
          python scripts/check_machine_readable_artifacts.py .
          git diff --check

      - name: Commit technical completion package
        shell: bash
        run: |
          git config user.name "Jim Daley"
          git config user.email "94642455+flynn33@users.noreply.github.com"
          git add --all
          git commit -m "Implement M2 fixture catalog and acceptance gate"
          git push origin HEAD:m2/complete-canonical-contract-schema-foundation
