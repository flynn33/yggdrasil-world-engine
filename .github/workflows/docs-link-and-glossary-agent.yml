name: Docs Link And Glossary Agent

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-link-and-glossary:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate docs links and glossary
        shell: pwsh
        run: ./scripts/github/Test-DocsAndGlossary.ps1
