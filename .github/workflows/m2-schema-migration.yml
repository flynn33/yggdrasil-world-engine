name: M2 Schema Migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m2-schema-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Apply reviewed M2 schema migration
        shell: bash
        run: |
          cat > /tmp/m2-schema-migration.py.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/m2-schema-migration.py.gz.b64 | gzip --decompress > /tmp/m2-schema-migration.py
          test "$(sha256sum /tmp/m2-schema-migration.py | cut -d' ' -f1)" = "0e5534fdcb6e6063ad832b5032f0236f5bc756fc22f1f76633ed7da39afdb6f1"
          rm .github/workflows/m2-schema-migration.yml
          rm -f .github/workflows/m2-source-validation.yml
          python /tmp/m2-schema-migration.py .

      - name: Validate schema migration
        run: bash scripts/run_checks.sh --context push

      - name: Commit and push migration
        shell: bash
        run: |
          git config user.name "Jim Daley"
          git config user.email "94642455+flynn33@users.noreply.github.com"
          git add --all
          git commit -m "Establish executable M2 schema foundation"
          git push origin HEAD:main
