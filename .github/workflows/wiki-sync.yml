name: Wiki Sync

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-wiki:
    name: Publish Owner Wiki Projection
    runs-on: ubuntu-latest
    steps:
      - name: Verify owner publication scope
        run: |
          test "$GITHUB_ACTOR" = "flynn33"
          test "$GITHUB_REPOSITORY" = "flynn33/yggdrasil-world-engine"

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: main-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare, verify and publish wiki
        env:
          WIKI_OWNER_TOKEN: ${{ secrets.WIKI_OWNER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$WIKI_OWNER_TOKEN" ]; then
            echo "Owner wiki credential is not configured. Use the independent local owner publication route."
            exit 1
          fi
          python -c 'import json,os,sys,urllib.request; request=urllib.request.Request("https://api.github.com/user",headers={"Authorization":"Bearer "+os.environ["WIKI_OWNER_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}); account=json.load(urllib.request.urlopen(request)); sys.exit(0 if account.get("login")=="flynn33" else "Wiki publication requires the flynn33 account")'
          wiki_url="https://github.com/flynn33/yggdrasil-world-engine.wiki.git"
          wiki_dir="$RUNNER_TEMP/ywe-wiki"
          credential_helper='!f() { echo username=x-access-token; echo password="$WIKI_OWNER_TOKEN"; }; f'
          base_revision=$(git -c credential.helper= -c credential.helper="$credential_helper" ls-remote "$wiki_url" refs/heads/master | cut -f1)
          test -n "$base_revision"
          git -c credential.helper= -c credential.helper="$credential_helper" clone --branch master "$wiki_url" "$wiki_dir"
          test "$(git -C "$wiki_dir" rev-parse HEAD)" = "$base_revision"
          source_revision=$(git -C main-repo rev-parse HEAD)
          canonical_version=$(cat main-repo/VERSION)
          test -n "$canonical_version"
          python -B main-repo/scripts/github/prepare_wiki.py prepare --source-root "$GITHUB_WORKSPACE/main-repo" --wiki-root "$wiki_dir" --source-revision "$source_revision" --report "$RUNNER_TEMP/wiki-prepare.json"
          python -B main-repo/scripts/github/prepare_wiki.py verify --source-root "$GITHUB_WORKSPACE/main-repo" --wiki-root "$wiki_dir" --source-revision "$source_revision" --report "$RUNNER_TEMP/wiki-verify.json"
          mapfile -t changed_pages < <(python -c 'import json,os; print("\n".join(json.load(open(os.environ["RUNNER_TEMP"]+"/wiki-prepare.json"))["changed_paths"]))')
          if [ -z "${changed_pages[0]:-}" ]; then
            echo "Wiki already matches the pinned source projection."
            exit 0
          fi
          git -C "$wiki_dir" config user.name "Jim Daley"
          git -C "$wiki_dir" config user.email "94642455+flynn33@users.noreply.github.com"
          git -C "$wiki_dir" add -- "${changed_pages[@]}"
          git -C "$wiki_dir" -c commit.gpgsign=false commit -m "Update wiki from repository $source_revision"
          wiki_revision=$(git -C "$wiki_dir" rev-parse HEAD)
          test "$(git -c credential.helper= -c credential.helper="$credential_helper" ls-remote "$wiki_url" refs/heads/master | cut -f1)" = "$base_revision"
          git -C "$wiki_dir" -c credential.helper= -c credential.helper="$credential_helper" push origin HEAD:refs/heads/master
          test "$(git -c credential.helper= -c credential.helper="$credential_helper" ls-remote "$wiki_url" refs/heads/master | cut -f1)" = "$wiki_revision"
          python -B main-repo/scripts/github/prepare_wiki.py verify --source-root "$GITHUB_WORKSPACE/main-repo" --wiki-root "$wiki_dir" --source-revision "$source_revision" --report "$RUNNER_TEMP/wiki-published.json"

      - name: Preserve publication reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-publication-readback
          path: ${{ runner.temp }}/wiki-*.json
          if-no-files-found: ignore
