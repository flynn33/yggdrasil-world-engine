name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - 'wiki.md'
      - 'guide.md'
      - 'developer-guide.md'
      - 'docs/**'
      - 'lore/**'
      - 'core/**/README.md'
      - 'modules/**/README.md'
      - 'modules/**/module_description.md'
      - 'adapters/**/*.md'
      - 'data/**/README.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'version.txt'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-wiki:
    name: Sync Documentation to Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: echo "version=$(cat main-repo/version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Sync wiki pages
        run: |
          cd wiki-repo

          # --- Home page ---
          cat > Home.md << 'HOMEEOF'
          # Yggdrasil World Engine Wiki

          Welcome to the **Yggdrasil World Engine** wiki — the comprehensive reference for the ASH Model of the Universe-driven narrative simulation engine.
          HOMEEOF

          VERSION="${{ steps.version.outputs.version }}"
          echo "" >> Home.md
          echo "**Version:** ${VERSION} | **Framework:** [Forsetti Framework v0.1.0](https://github.com/flynn33/Forsetti-Framework) | **Owner:** Jim Daley" >> Home.md
          cat >> Home.md << 'HOMEEOF'

          ---

          ## Quick Navigation

          ### Core Documentation
          - [[Master Specification]] — Complete canonical design document
          - [[Architecture Overview]] — Engine-first architecture and dependency graph
          - [[Architecture Layers]] — Layer hierarchy and dependency rules
          - [[System Workflow Atlas]] — Runtime, validation, and transition workflow maps

          ### Cosmology & Lore
          - [[WRW Cosmology]] — Primordial state, creation event, realm formation
          - [[Wolf Canon]] — White Wolf and Dark Wolf companion canon
          - [[Bloodline History]] — Ancestral resonance and mythic lineages

          ### Engine Reference
          - [[Core Engines]] — Cosmology, Realm, ASH Pattern, Narrative, Perception
          - [[Expansion Modules]] — Quest, Myth, Prophecy, Artifact, Creature
          - [[Ability Power Engine]] — Phase 14 source-provenance, unlock pressure, and consequence handling
          - [[Data Schemas]] — Player, realm, pattern, quest, myth, bloodline schemas

          ### Visual Atlases
          - [[Phase Contract Atlas]] — Accepted phase sequence and contract exchange map
          - [[Validation Matrix]] — Local and GitHub validation gate map
          - [[Wiki Publication Process]] — Generated and manually maintained wiki surfaces

          ### Integration
          - [[Forsetti Integration Rules]] — Design principles and compliance rules
          - [[Developer Guide]] — Guide for engine implementors
          - [[ASH Compliance]] — Cosmological compliance rules and checklist
          - [[Adapter Specifications]] — Unity, Unreal, Godot adapter interfaces

          ### Contributing
          - [[Contributing Guide]] — How to contribute
          - [[Changelog]] — Version history and release notes

          ---

          > Core wiki pages are synchronized from repository documentation. Manual wiki pages should stay aligned with the same source-truth and validation surfaces.
          HOMEEOF

          # --- Architecture Overview ---
          cp ../main-repo/docs/architecture/README.md Architecture-Overview.md

          # --- Architecture Layers ---
          cp ../main-repo/docs/architecture/ARCHITECTURE_LAYERS.md Architecture-Layers.md

          # --- ASH Compliance (merge both files) ---
          cp ../main-repo/docs/ash_compliance/README.md ASH-Compliance.md
          echo "" >> ASH-Compliance.md
          echo "---" >> ASH-Compliance.md
          echo "" >> ASH-Compliance.md
          cat ../main-repo/docs/ash_compliance/ash_compliance_checklist.md >> ASH-Compliance.md

          # --- Lore pages ---
          cp ../main-repo/lore/wrw_cosmology/README.md WRW-Cosmology.md
          cp ../main-repo/lore/wolf_canon/README.md Wolf-Canon.md
          cp ../main-repo/lore/bloodline_history/README.md Bloodline-History.md

          # --- Forsetti Integration Rules ---
          cp ../main-repo/guide.md Forsetti-Integration-Rules.md

          # --- Developer Guide ---
          cp ../main-repo/developer-guide.md Developer-Guide.md

          # --- Contributing Guide ---
          cp ../main-repo/CONTRIBUTING.md Contributing-Guide.md

          # --- Changelog ---
          if [ -f ../main-repo/CHANGELOG.md ]; then
            cp ../main-repo/CHANGELOG.md Changelog.md
          fi

          # --- Core Engines (composite page) ---
          {
            echo "# Core Engines"
            echo ""
            echo "The Yggdrasil World Engine is powered by five core engines that define the cosmological foundation."
            echo ""
            for engine in cosmology_engine realm_engine ash_pattern_engine narrative_engine perception_engine; do
              echo "---"
              echo ""
              cat "../main-repo/core/${engine}/README.md"
              echo ""
            done
          } > Core-Engines.md

          # --- Expansion Modules (composite page) ---
          {
            echo "# Expansion Modules"
            echo ""
            echo "Expansion modules extend the core engines with gameplay-facing systems. All meaningful generation consumes ASH Model-grounded state through YWE contracts and may use ASH Pattern System component diagnostics."
            echo ""
            for mod in quest_engine myth_engine prophecy_engine artifact_engine creature_engine; do
              echo "---"
              echo ""
              cat "../main-repo/modules/${mod}/module_description.md"
              echo ""
            done
          } > Expansion-Modules.md

          # --- Data Schemas page ---
          {
            echo "# Data Schemas"
            echo ""
            echo "All canonical data schemas live in the \`data/\` directory."
            echo ""
            echo "| Schema | Path |"
            echo "|--------|------|"
            echo "| Player State | \`data/player_schema.json\` |"
            echo "| Realm Registry | \`data/realm_registry/realms.json\` |"
            echo "| Realm Definitions | \`data/realm_registry/realm_definitions.json\` |"
            echo "| Pattern Archetypes | \`data/pattern_archetypes/pattern_schema.json\` |"
            echo "| Quest Seeds | \`data/quest_archetypes/quest_seed_schema.json\` |"
            echo "| Myth Records | \`data/myth_archetypes/myth_schema.json\` |"
            echo "| Bloodlines | \`data/bloodline_registry/bloodline_schema.json\` |"
            echo "| Prophecies | \`modules/prophecy_engine/prophecy_schema.json\` |"
            echo "| Player Runtime State | \`data/schemas/player_runtime_state_schema.json\` |"
            echo "| Worldstate Location Mutation | \`data/schemas/worldstate_location_mutation_schema.json\` |"
            echo "| Quest / NPC / Lore Generation | \`data/schemas/quest_npc_lore_generation_schema.json\` |"
            echo "| Ability Manifest | \`data/schemas/ability_manifest_schema.json\` |"
            echo "| Ability Consequence | \`data/schemas/ability_consequence_packet_schema.json\` |"
            echo "| Ability State Update | \`data/schemas/ability_state_update_packet_schema.json\` |"
            echo ""
            for dir in pattern_archetypes quest_archetypes myth_archetypes bloodline_registry; do
              if [ -f "../main-repo/data/${dir}/README.md" ]; then
                echo "---"
                echo ""
                cat "../main-repo/data/${dir}/README.md"
                echo ""
              fi
            done
          } > Data-Schemas.md

          # --- Adapter Specifications (composite page) ---
          {
            echo "# Adapter Specifications"
            echo ""
            echo "Adapters translate YWE engine outputs into engine-native implementations."
            echo ""
            for adapter in unity unreal godot; do
              echo "---"
              echo ""
              cat "../main-repo/adapters/${adapter}/adapter_interface.md"
              echo ""
            done
          } > Adapter-Specifications.md

          # --- Master Specification reference ---
          cat > Master-Specification.md << 'SPECEOF'
          # Master Specification

          The complete canonical design specification for the Yggdrasil World Engine lives in the repository at:

          ```
          docs/master_specification/YWE_MASTER_SPECIFICATION.md
          ```

          Clone the repository and read the full document for the complete 25-section design specification covering cosmology, realms, player model, alignment, bloodlines, perception, engine architecture, data schemas, adapters, ASH compliance, and implementation principles.
          SPECEOF

      - name: Push wiki changes
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to push"
          else
            git commit -m "Sync wiki from main repo ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
