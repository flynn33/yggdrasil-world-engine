name: Release Readiness Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release readiness
        shell: pwsh
        run: ./scripts/github/Test-ReleaseReadiness.ps1
