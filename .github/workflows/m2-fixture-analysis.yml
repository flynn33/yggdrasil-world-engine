name: M2 Fixture Analysis

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m2-fixture-analysis.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Extract exact valid schema matches
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from typing import Any

          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          root = Path(".")
          baseline = json.loads((root / "data/validation/schema_quality_baseline.json").read_text(encoding="utf-8-sig"))
          unresolved = baseline["known_debt"]["unbound_json_examples"]

          schemas: dict[str, dict[str, Any]] = {}
          registry = Registry()
          for path in sorted(root.rglob("*.json")):
              relative = path.relative_to(root).as_posix()
              try:
                  value = json.loads(path.read_text(encoding="utf-8-sig"))
              except Exception:
                  continue
              if isinstance(value, dict) and isinstance(value.get("$schema"), str):
                  schemas[relative] = value
                  if isinstance(value.get("$id"), str):
                      try:
                          registry = registry.with_resource(value["$id"], Resource.from_contents(value))
                      except Exception:
                          pass

          validators = {}
          for path, schema in schemas.items():
              try:
                  validators[path] = Draft202012Validator(schema, registry=registry)
              except Exception:
                  pass

          def nodes(value: Any, pointer: str = ""):
              yield pointer or "/", value
              if isinstance(value, dict):
                  for key, item in value.items():
                      escaped = str(key).replace("~", "~0").replace("/", "~1")
                      yield from nodes(item, f"{pointer}/{escaped}")
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      yield from nodes(item, f"{pointer}/{index}")

          lines = [
              "# M2 Exact Valid Schema Matches",
              "",
              "Generic extension-schema matches are deliberately excluded.",
              "",
              "| Fixture | Exact zero-error schema matches |",
              "|---|---|",
          ]
          for example_path in unresolved:
              document = json.loads((root / example_path).read_text(encoding="utf-8-sig"))
              matches = []
              for pointer, node in nodes(document):
                  if not isinstance(node, (dict, list)):
                      continue
                  for schema_path, validator in validators.items():
                      if schema_path.endswith("common/extension.schema.json"):
                          continue
                      if validator.is_valid(node):
                          matches.append((schema_path, pointer))
              matches = sorted(set(matches))
              rendered = "; ".join(f"`{schema}` @ `{pointer}`" for schema, pointer in matches) or "None"
              lines.append(f"| `{example_path}` | {rendered} |")

          Path("/tmp/m2-valid-matches.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Preserve exact-match report
        shell: bash
        run: |
          git config user.name "Jim Daley"
          git config user.email "94642455+flynn33@users.noreply.github.com"
          git fetch origin analysis/m2-fixture-bindings
          git checkout -B analysis/m2-fixture-bindings origin/analysis/m2-fixture-bindings
          cp /tmp/m2-valid-matches.md docs/design-planning/m2/fixture-valid-matches.md
          git add docs/design-planning/m2/fixture-valid-matches.md
          git commit -m "Record exact M2 fixture schema matches"
          git push origin HEAD:analysis/m2-fixture-bindings
