name: M2 Fixture Analysis

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m2-fixture-analysis.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Build concise fixture structure report
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from pathlib import Path
          from typing import Any

          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          root = Path(".")
          baseline = json.loads(
              (root / "data/validation/schema_quality_baseline.json").read_text(encoding="utf-8-sig")
          )
          unresolved = baseline["known_debt"]["unbound_json_examples"]

          schema_docs: dict[str, dict[str, Any]] = {}
          registry = Registry()
          for path in sorted(root.rglob("*.json")):
              relative = path.relative_to(root).as_posix()
              try:
                  document = json.loads(path.read_text(encoding="utf-8-sig"))
              except Exception:
                  continue
              if isinstance(document, dict) and isinstance(document.get("$schema"), str):
                  schema_docs[relative] = document
                  schema_id = document.get("$id")
                  if isinstance(schema_id, str):
                      try:
                          registry = registry.with_resource(schema_id, Resource.from_contents(document))
                      except Exception:
                          pass

          validators = {}
          for schema_path, schema in schema_docs.items():
              try:
                  validators[schema_path] = Draft202012Validator(schema, registry=registry)
              except Exception:
                  pass

          def normalize_tokens(value: str) -> set[str]:
              value = re.sub(r"\.(example|reject|spec|schema)$", "", value)
              return {
                  token for token in re.split(r"[^a-z0-9]+", value.lower())
                  if token and token not in {
                      "example", "examples", "invalid", "reject", "schema",
                      "ravenfall", "gate", "phase", "json", "record",
                  }
              }

          def iter_nodes(value: Any, pointer: str = ""):
              yield pointer or "/", value
              if isinstance(value, dict):
                  for key, item in value.items():
                      escaped = str(key).replace("~", "~0").replace("/", "~1")
                      yield from iter_nodes(item, f"{pointer}/{escaped}")
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      yield from iter_nodes(item, f"{pointer}/{index}")

          def shape(value: Any, depth: int = 0) -> Any:
              if depth >= 3:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {key: shape(item, depth + 1) for key, item in value.items()}
              if isinstance(value, list):
                  if not value:
                      return []
                  return [shape(value[0], depth + 1), {"length": len(value)}]
              if value is None:
                  return "null"
              return type(value).__name__

          results = []
          for example_path in unresolved:
              document = json.loads((root / example_path).read_text(encoding="utf-8-sig"))
              nodes = list(iter_nodes(document))
              example_tokens = normalize_tokens(Path(example_path).stem)
              rankings = []
              for schema_path, schema in schema_docs.items():
                  current_validator = validators.get(schema_path)
                  if current_validator is None:
                      continue
                  props = schema.get("properties") if isinstance(schema.get("properties"), dict) else {}
                  required = set(schema.get("required", [])) if isinstance(schema.get("required"), list) else set()
                  token_score = len(example_tokens & normalize_tokens(Path(schema_path).stem))
                  best = None
                  for pointer, node in nodes:
                      if not isinstance(node, (dict, list)):
                          continue
                      key_score = 0.0
                      if isinstance(node, dict):
                          keys = set(node)
                          key_score += 3.0 * len(keys & set(props))
                          key_score += 5.0 * len(keys & required)
                          key_score -= 1.0 * len(required - keys)
                      errors = list(current_validator.iter_errors(node))
                      score = 10.0 * token_score + key_score - min(len(errors), 20)
                      candidate = {
                          "schema_path": schema_path,
                          "schema_id": schema.get("$id"),
                          "score": round(score, 2),
                          "pointer": pointer,
                          "valid": not errors,
                          "error_count": len(errors),
                          "error_validators": sorted({str(error.validator) for error in errors}),
                          "error_messages": [error.message for error in errors[:8]],
                      }
                      if best is None or (candidate["score"], -candidate["error_count"]) > (best["score"], -best["error_count"]):
                          best = candidate
                  if best is not None:
                      rankings.append(best)
              rankings.sort(key=lambda item: (-item["score"], item["error_count"], item["schema_path"]))
              grep = subprocess.run(
                  ["git", "grep", "-l", "--fixed-strings", example_path, "--", ":!data/validation/schema_quality_baseline.json"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              results.append({
                  "example_path": example_path,
                  "document_shape": shape(document),
                  "top_candidates": rankings[:6],
                  "mentioning_files": sorted(line for line in grep.stdout.splitlines() if line),
              })

          Path("/tmp/fixture-analysis-summary.json").write_text(
              json.dumps({
                  "artifact_type": "m2_fixture_binding_analysis_summary",
                  "fixture_count": len(results),
                  "results": results,
              }, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Preserve concise report
        shell: bash
        run: |
          git config user.name "Jim Daley"
          git config user.email "94642455+flynn33@users.noreply.github.com"
          git fetch origin analysis/m2-fixture-bindings
          git checkout -B analysis/m2-fixture-bindings origin/analysis/m2-fixture-bindings
          cp /tmp/fixture-analysis-summary.json docs/design-planning/m2/fixture-analysis-summary.json
          git add docs/design-planning/m2/fixture-analysis-summary.json
          git commit -m "Add concise M2 fixture structure analysis"
          git push origin HEAD:analysis/m2-fixture-bindings
