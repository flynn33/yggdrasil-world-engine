name: Contributor Identity Policy

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  contributor-identity-check:
    name: Contributor Identity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit identity policy
        shell: bash
        run: |
          pwsh -NoLogo -NoProfile -File scripts/github/Test-ContributorIdentityPolicy.ps1 \
            -EventPath "${{ github.event_path }}" \
            -EventName "${{ github.event_name }}"
