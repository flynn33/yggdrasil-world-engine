name: Forsetti Compliance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  forsetti-compliance:
    name: Forsetti Framework Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full validation suite
        run: |
          chmod +x scripts/run_checks.sh
          bash scripts/run_checks.sh

      - name: Verify governance files exist
        run: |
          MISSING=0
          for f in yggdrasil-instructions.json agentic-coding-policy.json guide.md developer-guide.md wiki.md; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "Forsetti governance files are incomplete"
            exit 1
          fi
          echo "All governance files present"

      - name: Validate governance file integrity
        run: |
          python3 << 'PYEOF'
          import json, sys

          errors = []

          # Validate yggdrasil-instructions.json
          with open("yggdrasil-instructions.json") as f:
              instructions = json.load(f)

          required_keys = ["artifact_type", "artifact_version", "project", "principles", "architecture", "core_engines", "expansion_engines", "cosmological_invariants"]
          for key in required_keys:
              if key not in instructions:
                  errors.append(f"yggdrasil-instructions.json missing key: {key}")

          # Check owner
          if instructions.get("project", {}).get("owner") != "Jim Daley":
              errors.append("yggdrasil-instructions.json: owner must be 'Jim Daley'")

          # Check framework reference
          if "Forsetti" not in instructions.get("project", {}).get("framework", ""):
              errors.append("yggdrasil-instructions.json: must reference Forsetti Framework")

          # Check 5 principles
          if len(instructions.get("principles", [])) < 5:
              errors.append("yggdrasil-instructions.json: must have at least 5 principles")

          # Check 5 layers
          layers = instructions.get("architecture", {}).get("layers", [])
          if len(layers) < 5:
              errors.append("yggdrasil-instructions.json: must define 5 architecture layers")

          # Validate layer dependency direction
          layer_names = [l["name"] for l in layers]
          expected_order = ["Core", "Data", "Runtime", "Presentation", "Editor"]
          if layer_names != expected_order:
              errors.append(f"yggdrasil-instructions.json: layer order must be {expected_order}, got {layer_names}")

          # Check Core has no dependencies
          core_layer = next((l for l in layers if l["name"] == "Core"), None)
          if core_layer and len(core_layer.get("allowed_dependencies", ["notempty"])) > 0:
              errors.append("yggdrasil-instructions.json: Core layer must have no dependencies")

          # Validate no reverse dependencies
          for i, layer in enumerate(layers):
              allowed = layer.get("allowed_dependencies", [])
              for dep in allowed:
                  dep_idx = next((j for j, l in enumerate(layers) if l["name"] == dep), -1)
                  if dep_idx >= i:
                      errors.append(f"yggdrasil-instructions.json: {layer['name']} has reverse dependency on {dep}")

          # Check 5 core engines
          core_engines = instructions.get("core_engines", [])
          required_engines = ["cosmology_engine", "realm_engine", "ash_pattern_engine", "narrative_engine", "perception_engine"]
          for eng in required_engines:
              if eng not in core_engines:
                  errors.append(f"yggdrasil-instructions.json: missing core engine {eng}")

          # Check 10 cosmological invariants
          invariants = instructions.get("cosmological_invariants", [])
          if len(invariants) < 10:
              errors.append(f"yggdrasil-instructions.json: expected >= 10 cosmological invariants, got {len(invariants)}")

          # Validate agentic-coding-policy.json
          with open("agentic-coding-policy.json") as f:
              policy = json.load(f)

          if policy.get("owner") != "Jim Daley":
              errors.append("agentic-coding-policy.json: owner must be 'Jim Daley'")

          if "Forsetti" not in policy.get("framework", ""):
              errors.append("agentic-coding-policy.json: must reference Forsetti Framework")

          rules = policy.get("mandatory_rules", [])
          if len(rules) < 10:
              errors.append(f"agentic-coding-policy.json: expected >= 10 mandatory rules, got {len(rules)}")

          # Check critical rules exist
          rule_ids = [r.get("id") for r in rules]
          critical_rules = ["R001", "R002", "R003", "R004", "R011"]
          for rid in critical_rules:
              if rid not in rule_ids:
                  errors.append(f"agentic-coding-policy.json: missing critical rule {rid}")

          # Check operating modes
          modes = policy.get("operating_modes", {})
          if "spec_repo_mode" not in modes:
              errors.append("agentic-coding-policy.json: missing spec_repo_mode")
          if "engine_repo_mode" not in modes:
              errors.append("agentic-coding-policy.json: missing engine_repo_mode")

          # Report
          if errors:
              print("FORSETTI COMPLIANCE VIOLATIONS:")
              for e in errors:
                  print(f"  FAIL: {e}")
              sys.exit(1)
          else:
              print("Forsetti governance files are compliant.")
          PYEOF

      - name: Check engine interface contracts
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          errors = []

          # Map of valid core engine directory names
          CORE_ENGINES = {"cosmology_engine", "realm_engine", "ash_pattern_engine", "narrative_engine", "perception_engine"}

          # Every core engine must have engine_interface.json
          core_dir = "core"
          for engine in os.listdir(core_dir):
              engine_path = os.path.join(core_dir, engine)
              if not os.path.isdir(engine_path):
                  continue
              interface_file = os.path.join(engine_path, "engine_interface.json")
              if not os.path.exists(interface_file):
                  errors.append(f"Missing engine interface: {interface_file}")
                  continue

              with open(interface_file) as f:
                  iface = json.load(f)

              # Validate required fields (engine_id, purpose, layer, methods)
              for field in ["engine_id", "purpose", "layer", "methods"]:
                  if field not in iface:
                      errors.append(f"{interface_file}: missing required field '{field}'")

              # Validate layer is "core"
              if iface.get("layer") != "core":
                  errors.append(f"{interface_file}: layer must be 'core', got '{iface.get('layer')}'")

              # Validate dependencies reference valid core engines (fully qualified IDs)
              deps = iface.get("dependencies", [])
              for dep in deps:
                  # Dependencies use fully qualified IDs like "ywe.core.cosmology_engine"
                  dep_name = dep.split(".")[-1] if "." in dep else dep
                  if dep_name not in CORE_ENGINES:
                      errors.append(f"{interface_file}: dependency '{dep}' does not reference a known core engine")

          # Every expansion module must have an interface
          modules_dir = "modules"
          for module in os.listdir(modules_dir):
              module_path = os.path.join(modules_dir, module)
              if not os.path.isdir(module_path):
                  continue
              # Find interface file (pattern: *_interface.json)
              iface_files = [f for f in os.listdir(module_path) if f.endswith("_interface.json")]
              if not iface_files:
                  errors.append(f"Missing module interface in: {module_path}")
                  continue

              for iface_file in iface_files:
                  with open(os.path.join(module_path, iface_file)) as f:
                      iface = json.load(f)

                  # Validate required fields
                  for field in ["engine_id", "purpose", "layer", "methods"]:
                      if field not in iface:
                          errors.append(f"{module_path}/{iface_file}: missing required field '{field}'")

                  # Modules must be "module" layer
                  if iface.get("layer") != "module":
                      errors.append(f"{module_path}/{iface_file}: expansion modules must be 'module' layer, got '{iface.get('layer')}'")

                  # Modules must depend on ash_pattern_engine (fully qualified)
                  deps = iface.get("dependencies", [])
                  dep_names = [d.split(".")[-1] if "." in d else d for d in deps]
                  if "ash_pattern_engine" not in dep_names:
                      errors.append(f"{module_path}/{iface_file}: expansion module must depend on ash_pattern_engine")

          if errors:
              print("ENGINE CONTRACT VIOLATIONS:")
              for e in errors:
                  print(f"  FAIL: {e}")
              sys.exit(1)
          else:
              print("All engine contracts valid.")
          PYEOF

      - name: Check no independent random generators
        run: |
          # Search for patterns that suggest independent random generation
          VIOLATIONS=0

          # Check for random/rand imports in any Python files
          if grep -rn "import random" --include="*.py" . 2>/dev/null | grep -v "validate_" | grep -v "__pycache__"; then
            echo "WARNING: random module usage detected outside validation scripts"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Check JSON schemas for independent_random flags
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            if python3 -c "
          import json, sys
          with open('$f') as fh:
              data = json.load(fh)
          def check(obj, path=''):
              if isinstance(obj, dict):
                  if obj.get('independent_random_allowed') == True:
                      print(f'VIOLATION in $f at {path}: independent_random_allowed is True')
                      sys.exit(1)
                  for k, v in obj.items():
                      check(v, f'{path}.{k}')
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      check(v, f'{path}[{i}]')
          check(data)
          " 2>/dev/null; then
              :
            else
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo "Independent random generator violations found"
            exit 1
          fi

          echo "No independent random generators detected. ASH pattern compliance verified."

      - name: Compliance summary
        if: always()
        run: |
          echo "=========================================="
          echo "Forsetti Compliance Check Complete"
          echo "=========================================="
          echo ""
          echo "Checks performed:"
          echo "  1. Full validation suite (architecture, schemas, ASH)"
          echo "  2. Governance file existence"
          echo "  3. Governance file integrity (owner, framework, rules, layers, invariants)"
          echo "  4. Engine interface contracts (fields, layers, dependencies)"
          echo "  5. No independent random generators"
          echo ""
          echo "Framework: Forsetti Framework v0.1.0"
          echo "Owner: Jim Daley"
