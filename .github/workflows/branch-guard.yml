name: Branch Guard

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-no-engine-code:
    name: No Engine-Specific Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Check platform product boundary
        run: python3 scripts/validate_repository.py --check platform_agnosticism
