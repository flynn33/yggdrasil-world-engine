name: M2 Source Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m2-source-validation.yml"
      - "core/**"
      - "data/**"
      - "conformance/**"
      - "docs/**"
      - "examples/**"
      - "scripts/**"
      - "specs/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run canonical repository checks
        run: bash scripts/run_checks.sh

      - name: Run M2 acceptance gate when present
        shell: bash
        run: |
          if [[ -f scripts/check_m2_acceptance.py ]]; then
            python scripts/check_m2_acceptance.py .
          else
            echo "M2 acceptance gate is not present in this revision."
          fi

      - name: Export exact checked-out source
        shell: bash
        run: tar --exclude=.git -czf ywe-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ywe-source-${{ github.sha }}
          path: ywe-source.tar.gz
          if-no-files-found: error
          retention-days: 1
