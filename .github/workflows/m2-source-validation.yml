name: M2 Source Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/m2-source-validation.yml"
      - "core/**"
      - "data/**"
      - "conformance/**"
      - "docs/**"
      - "examples/**"
      - "scripts/**"
      - "specs/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run canonical repository checks
        id: canonical
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bash scripts/run_checks.sh 2>&1 | tee canonical-checks.log

      - name: Run M2 acceptance gate
        id: m2
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [[ -f scripts/check_m2_acceptance.py ]]; then
            python scripts/check_m2_acceptance.py . 2>&1 | tee m2-acceptance.log
          else
            echo "M2 acceptance gate is not present in this revision." | tee m2-acceptance.log
            exit 1
          fi

      - name: Record source identity
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > source-commit.txt
          git status --porcelain > source-status.txt
          git branch --show-current > source-branch.txt

      - name: Export exact checked-out source
        if: always()
        shell: bash
        run: tar --exclude=.git --exclude=ywe-source.tar.gz -czf ywe-source.tar.gz .

      - name: Upload source and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ywe-source-${{ github.sha }}
          path: |
            ywe-source.tar.gz
            canonical-checks.log
            m2-acceptance.log
            source-commit.txt
            source-status.txt
            source-branch.txt
          if-no-files-found: error
          retention-days: 1

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          test "${{ steps.canonical.outcome }}" = "success"
          test "${{ steps.m2.outcome }}" = "success"
