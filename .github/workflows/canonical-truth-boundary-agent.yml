name: Canonical Truth Boundary Agent

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-truth-boundary:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate canonical truth boundaries
        shell: pwsh
        run: ./scripts/github/Test-CanonicalTruthBoundaries.ps1
