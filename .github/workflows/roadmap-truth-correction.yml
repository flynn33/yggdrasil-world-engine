name: Roadmap Truth Correction

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/roadmap-truth-correction.yml"

permissions:
  contents: write

jobs:
  correct-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Apply truthful roadmap correction
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import re
          from pathlib import Path

          ROOT = Path(".")
          ROADMAP_PATH = ROOT / "data/governance/specification_roadmap.json"
          ROADMAP_DOC_PATH = ROOT / "docs/project/YWE_AGNOSTIC_SPECIFICATION_ROADMAP.md"
          STATUS_PATH = ROOT / "docs/project/repository_status.md"
          README_PATH = ROOT / "README.md"
          PROJECT_RECORD_PATH = ROOT / "docs/design-planning/Project_Record.md"
          HANDOFF_PATH = ROOT / "docs/design-planning/handoffs/2026-09-19-consumer-compatibility.md"
          DEBT_PATH = ROOT / "data/validation/schema_quality_baseline.json"
          TEMP_WORKFLOW_PATH = ROOT / ".github/workflows/roadmap-truth-correction.yml"

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise RuntimeError(message)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              require(text.count(old) == 1, f"{label}: expected one exact match, found {text.count(old)}")
              return text.replace(old, new, 1)

          roadmap = json.loads(ROADMAP_PATH.read_text(encoding="utf-8"))
          milestones = {item["id"]: item for item in roadmap["milestones"]}
          require(roadmap["current_milestone"] == "M2", "Current milestone is not M2")
          require(milestones["M0"]["status"] == "complete", "M0 is not complete")
          require(milestones["M1"]["status"] == "complete", "M1 is not complete")
          require(milestones["M2"]["status"] == "in_progress", "M2 is not in progress")
          require(milestones["M2"]["acceptance_evidence"] == [], "M2 already has acceptance evidence")
          require(milestones["M3"]["status"] == "planned", "M3 is not planned")

          debt = json.loads(DEBT_PATH.read_text(encoding="utf-8"))
          counts = {key: len(value) for key, value in debt["known_debt"].items()}
          expected_counts = {
              "declared_schema_missing_id": 0,
              "annotation_only_schema_documents": 0,
              "schema_named_json_without_schema_declaration": 0,
              "unbound_json_examples": 39,
          }
          require(counts == expected_counts, f"Unexpected M2 debt counts: {counts}")

          roadmap["publication"]["verified_on"] = "2026-09-20"

          status_source = next(
              item for item in roadmap["status_sources"]
              if item["path"] == "docs/project/repository_status.md"
          )
          status_source["required_markers"] = [
              "| Agnostic specification release readiness | Not ready |",
              "| Published releases | None; no GitHub Release objects or agnostic specification releases have been published |",
              "| Current roadmap milestone | M2 - Build the canonical contract and schema foundation (in progress; acceptance not recorded) |",
              "| M2 schema-quality debt | 39 unbound JSON examples remain; the other three M2 schema-debt categories are empty |",
              "| M2 acceptance evidence | Not recorded; the fixture catalog and roadmap-derived acceptance gate/report are still required |",
              "| Platform product work | Deferred through M10 |",
          ]

          validation = next(
              item for item in roadmap["subsystems"]
              if item["id"] == "validation_governance"
          )
          validation["evidence_refs"] = [
              "data/governance/specification_roadmap.json",
              "data/validation/m2_json_contract_profile.json",
              "data/validation/m2_contract_migration_manifest.json",
              "data/validation/schema_quality_baseline.json",
              "data/validation/repository_quality_debt_inventory.json",
          ]
          validation["open_work"] = [
              "Bind the remaining 39 JSON examples to exact schemas and expected outcomes.",
              "Create the complete M2 fixture catalog and roadmap-derived acceptance gate and evidence.",
              "Run the consolidated checks and M2 gate from a clean offline checkout before acceptance.",
          ]

          m2 = milestones["M2"]
          deliverable = "Roadmap-derived M2 acceptance gate and durable acceptance evidence."
          if deliverable not in m2["deliverables"]:
              m2["deliverables"].append(deliverable)
          criterion = "A roadmap-derived M2 acceptance gate passes from a clean offline checkout."
          if criterion not in m2["exit_criteria"]:
              m2["exit_criteria"].append(criterion)

          ROADMAP_PATH.write_text(
              json.dumps(roadmap, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          roadmap_doc = ROADMAP_DOC_PATH.read_text(encoding="utf-8")
          roadmap_doc = replace_once(
              roadmap_doc,
              "| Schema system | Incomplete | Complete identifiers, convert descriptive records, bind fixtures, validate instances, and eliminate tracked debt |",
              "| Schema system | M2 in progress | JSON Schema profile and protected-record migrations exist; 39 examples remain unbound, and the fixture catalog, acceptance gate, and durable acceptance evidence are not yet present |",
              "roadmap material-work row",
          )

          m2_section = """## M2 — Build the canonical contract and schema foundation

          Status: `in_progress`
          Dependencies: M1
          Indicative effort: 4–6 weeks
          Owner role: Contract and schema maintainers

          Deliverables:

          - One JSON Schema 2020-12 profile, URI namespace, catalog, and offline resolver.
          - Convert descriptive schema-named records into schemas or rename them by
            their actual role.
          - Common identifier, reference, version, time, ordering, request, result,
            event, provenance, diagnostic, error, transaction, compensation,
            idempotency, retry, extension, and deprecation contracts.
          - YAML structural schemas.
          - Explicit fixture catalog mapping schema, instance pointer, expected result,
            and expected requirement or error identifiers.
          - Positive, boundary, reject, recovery, replay, and migration fixtures.
          - Meta-schema, instance, reference, identifier, dependency, negative,
            property, and mutation validation.
          - Roadmap-derived M2 acceptance gate and durable acceptance evidence.

          Exit criteria:

          - Every normative schema passes its meta-schema.
          - Every reference resolves without a network dependency.
          - Every normative fixture is bound to a schema.
          - Every reject fixture fails for its intended requirement.
          - The schema-quality debt inventory is empty.
          - A roadmap-derived M2 acceptance gate passes from a clean offline checkout.

          """
          pattern = re.compile(
              r"(?ms)^## M2 — Build the canonical contract and schema foundation\n.*?(?=^## M3 — Complete core deterministic semantics and the reference oracle\n)"
          )
          require(len(pattern.findall(roadmap_doc)) == 1, "Cannot identify exactly one M2 roadmap section")
          roadmap_doc = pattern.sub(m2_section, roadmap_doc, count=1)
          ROADMAP_DOC_PATH.write_text(roadmap_doc, encoding="utf-8")

          status = STATUS_PATH.read_text(encoding="utf-8")
          status = replace_once(
              status,
              "| Executable schema completion | Partial; tracked under M2 |",
              "| Executable schema completion | Partial; schema identifiers and descriptive-record migrations are complete, while 39 JSON examples remain unbound |",
              "repository-status schema row",
          )
          status = replace_once(
              status,
              "| Current roadmap milestone | M2 - Build the canonical contract and schema foundation |",
              "| Current roadmap milestone | M2 - Build the canonical contract and schema foundation (in progress; acceptance not recorded) |\n| M2 schema-quality debt | 39 unbound JSON examples remain; the other three M2 schema-debt categories are empty |\n| M2 acceptance evidence | Not recorded; the fixture catalog and roadmap-derived acceptance gate/report are still required |",
              "repository-status M2 rows",
          )
          STATUS_PATH.write_text(status, encoding="utf-8")

          spec = importlib.util.spec_from_file_location(
              "roadmap_check", ROOT / "scripts/check_specification_roadmap.py"
          )
          require(spec is not None and spec.loader is not None, "Cannot load roadmap renderer")
          roadmap_check = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(roadmap_check)
          readme = README_PATH.read_text(encoding="utf-8")
          start_marker = "<!-- roadmap-status:start -->"
          end_marker = "<!-- roadmap-status:end -->"
          require(readme.count(start_marker) == 1, "README start marker count is not one")
          require(readme.count(end_marker) == 1, "README end marker count is not one")
          prefix, remainder = readme.split(start_marker, 1)
          _, suffix = remainder.split(end_marker, 1)
          rendered = roadmap_check.render_readme_status(roadmap)
          README_PATH.write_text(
              f"{prefix}{start_marker}\n{rendered}\n{end_marker}{suffix}",
              encoding="utf-8",
          )

          project_record = """# Yggdrasil World Engine — Project Record

          **Record ID:** YWE-RECOVERY-20260918  
          **Revision:** planning-13  
          **Date:** September 20, 2026  
          **Authoritative branch:** `main`  
          **Location:** `docs/design-planning/Project_Record.md`  
          **Supersedes:** planning-12; full history remains in Git.

          ## 1. Current working brief

          | Concern | Current state |
          |---|---|
          | Product / owner | Yggdrasil World Engine / Flynn, repository owner `flynn33` |
          | Product purpose | Platform-neutral, strictly object-oriented and modular engine specification |
          | Accepted milestones | M0 and M1 |
          | Active milestone | M2 — Build the canonical contract and schema foundation |
          | Next milestone | M3 remains planned and is not active |
          | M2 acceptance | Not recorded; exit criteria are not yet satisfied |
          | Platform products | Deferred until M10 acceptance |
          | Publication | Unreleased; no GitHub Release objects exist as verified September 20, 2026 |

          The machine-readable roadmap is milestone and status authority. Focused accepted contracts,
          governance records, schemas, fixtures, and validators remain engineering authority.

          ## 2. Preserved approved direction

          ASH Model Cosmology, the ASH Pattern System, and Aeostara are reference specifications.
          They are not package, build, module, runtime, source-code, or repository dependencies.
          YWE owns its domain model, object contracts, serialization contracts, and conformance
          requirements. Preserve strict object orientation, explicit invariant ownership,
          modularity, platform neutrality, and Core/profile separation. WRW and Ravenfall remain
          reference-profile evidence rather than universal Core truth.

          Working branches are preferred for bounded work. A completed branch must be merged or
          deleted after preservation is verified. Owner-account publication and admin bypass remain
          authorized when needed. Commit authorship must remain owner-only, with no co-author trailers.

          ## 3. Development method and source authority

          Raven Forge Development remains the standing method. The previously adopted immutable
          revision remains unrecovered. Version 0.6.2 at
          `ed0028a46bac9c5b92876a6ad6589ca421fd9499` remains an inspected reference only, not a
          silently adopted replacement. This correction does not upgrade the method or change any
          reference-system source pin.

          ## 4. Verified M2 state

          The September 19 schema-foundation migration is preserved on `main`. Current repository
          evidence establishes:

          | M2 item | Verified state |
          |---|---|
          | JSON Schema profile and offline-reference policy | Present in `data/validation/m2_json_contract_profile.json` |
          | Protected descriptive-record migrations | Present in `data/validation/m2_contract_migration_manifest.json` |
          | Declared schemas missing identifiers | 0 |
          | Annotation-only schema documents | 0 |
          | Schema-named JSON lacking declarations | 0 |
          | Unbound JSON examples | 39 |
          | Complete fixture catalog | Not present |
          | Roadmap-derived M2 acceptance gate | Not present |
          | Durable M2 acceptance report | Not present |
          | M2 milestone evidence | Empty in the roadmap |
          | M3 activation | Not authorized or recorded |

          The earlier report that all M2 technical work was complete was not supported by the live
          repository and is superseded. The owner's subsequent acceptance statement is not used as
          milestone evidence because the stated exit conditions were not actually satisfied.

          ## 5. Remaining M2 obligations

          1. Bind all 39 remaining JSON examples to exact schemas, instance pointers, expected
             outcomes, and intended requirement or error identifiers.
          2. Complete the fixture catalog across positive, boundary, reject, recovery, replay, and
             migration coverage.
          3. Provide a roadmap-derived M2 acceptance gate that verifies meta-schema validity,
             offline references, fixture bindings, intended reject reasons, and empty M2 schema debt.
          4. Produce durable acceptance evidence and run the consolidated checks and M2 gate from a
             clean offline checkout.
          5. Only after those checks pass, record M2 acceptance and activate M3.

          ## 6. Publication result and continuity

          An initial temporary correction workflow at commit `79322d90b7c8e22284064ec44174a866c79c0772`
          failed before modifying roadmap files because its compressed transport payload was
          corrupted. The replacement used an inline reviewed patch, removed the temporary workflow,
          ran the roadmap and consolidated repository checks, and published this planning-13 record.
          The containing commit is the authoritative save point.

          ## 7. Checkpoint

          **Current step:** M2 remains in progress with 39 unbound examples and missing milestone
          acceptance infrastructure.

          **Completed:** Corrected roadmap/status truth, preserved completed schema migration work,
          and removed false M2-complete/M3-active implications.

          **Next action:** Bind the remaining examples and build the complete fixture catalog and M2
          acceptance gate.

          **Needed from owner:** Nothing for continued M2 engineering.

          **Saved at:** `main`, in the commit containing this planning-13 record.
          """
          PROJECT_RECORD_PATH.write_text(project_record, encoding="utf-8")

          handoff = """# YWE Continuation — Truthful M2 Completion Work

          **Revision:** planning-13  
          **Date:** September 20, 2026  
          **Current authority:** [Project Record](../Project_Record.md), planning-13.  
          **Branch:** `main`.

          ## Current state

          M0 and M1 are accepted. M2 remains the active milestone. M3 remains planned and must not
          begin until M2's recorded exit criteria pass. Platform products remain deferred through
          M10.

          The current M2 schema-quality subledger contains zero missing-identifier findings, zero
          annotation-only schema findings, zero schema-named descriptive findings, and 39 unbound
          JSON examples. The JSON Schema profile and protected migration manifest exist. A complete
          fixture catalog, roadmap-derived M2 acceptance gate, durable M2 acceptance report, and M2
          roadmap acceptance evidence do not yet exist.

          ## Preserved boundaries

          YWE remains a platform-neutral, strictly object-oriented and modular specification.
          ASH Model Cosmology, APS, and Aeostara are reference specifications rather than product
          dependencies. YWE owns the resulting contracts. WRW and Ravenfall remain reference
          profiles. The inspected Raven Forge 0.6.2 revision remains a reference only; no method
          upgrade is implied.

          Use bounded working branches when useful. Merge or delete each completed branch after
          verifying preservation. Publish verified increments frequently. Keep commit authorship owner-only and do not add co-author trailers.

          ## Next eligible work

          1. Bind the 39 remaining examples to exact schemas and expected results.
          2. Build the complete M2 fixture catalog.
          3. Implement the roadmap-derived M2 acceptance gate and durable evidence.
          4. Run the consolidated checks and M2 gate from a clean offline checkout.
          5. Record M2 acceptance and activate M3 only after all exit criteria pass.

          ## Checkpoint

          **Current step:** Complete M2 fixture binding and acceptance infrastructure.  
          **Completed:** Roadmap and continuity corrected to match live repository evidence.  
          **Next action:** Start the example-binding inventory and fixture-catalog implementation.  
          **Needed from owner:** Nothing.  
          **Saved at:** `main`, in the commit containing this planning-13 handoff.
          """
          HANDOFF_PATH.write_text(handoff, encoding="utf-8")

          require(TEMP_WORKFLOW_PATH.is_file(), "Temporary correction workflow is missing")
          TEMP_WORKFLOW_PATH.unlink()
          PY

      - name: Validate corrected repository
        shell: bash
        run: |
          python scripts/check_specification_roadmap.py .
          bash scripts/run_checks.sh --context push
          git diff --check

      - name: Commit and push correction
        shell: bash
        run: |
          git config user.name "Jim Daley"
          git config user.email "94642455+flynn33@users.noreply.github.com"
          git add --all
          git commit -m "Correct M2 roadmap and continuity state"
          git push origin HEAD:main
