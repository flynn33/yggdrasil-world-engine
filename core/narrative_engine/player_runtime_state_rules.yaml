version: "1.0"
status: canonical_phase_10_contract
system: player_runtime_state_v1

authority_stack:
  game_layer: "Where Ravens Wait: Eternal Reckoning"
  engine_layer: "Yggdrasil World Engine"
  foundation: "ASH Cosmological Model"
  stability_component: "ASH Pattern System"

purpose:
  summary: >
    Player Runtime State is the canonical YWE runtime record for
    player-specific identity phase, memory, realm resonance, wolf resonance,
    bloodline pressure, branch reality references, perception posture, and
    generation-context references.
  boundary: >
    The state may influence YWEGenerationContextPacket and
    BranchGenerationContext records, but it must not mutate ASH math, rewrite
    shared world truth, alter base world ontology, or allow host adapters to
    author canonical player truth.

owned_records:
  - PlayerRuntimeState
  - PlayerRuntimeStateDelta

schema_refs:
  player_runtime_state: data/schemas/player_runtime_state_schema.json
  generation_context_packet: data/schemas/ywe_generation_context_packet_schema.json
  branch_event: data/schemas/branch_event_schema.json
  branch_generation_context: data/schemas/branch_generation_context_schema.json
  leaf_branch_reality_state: data/schemas/leaf_branch_reality_state_schema.json
  action_trace: data/schemas/player_action_trace_schema.json
  worldstate_delta: data/schemas/worldstate_delta_packet_schema.json
  future_generation_bias: data/schemas/future_generation_bias_update_schema.json

required_inputs:
  - PlayerActionTrace
  - BranchEvent
  - BranchGenerationContext
  - LeafBranchRealityState
  - CosmicPatternSnapshot
  - DiagnosticEnvelope
  - GenerationPlan
  - WorldstateDeltaPacket
  - FutureGenerationBiasUpdate
  - PerceptionStateRef
  - RealmContextRef

emitted_outputs:
  - PlayerRuntimeState
  - PlayerRuntimeStateDelta
  - YWEGenerationContextPacket.player_runtime_state_ref

phase_model:
  mortal_unknowing:
    meaning: Player begins mortal, with celestial memory veiled.
  first_stirrings:
    meaning: Repeated patterns begin to create phase-aware pressure.
  memory_recovery:
    meaning: Play-supported fragments become explicit but incomplete memory.
  identity_conflict:
    meaning: Competing interpretations of the player's origin become active.
  chosen_becoming:
    meaning: The player makes consequential choices that integrate identity.
  world_actor:
    meaning: The player's identity has world-visible consequence.

state_layers:
  identity_core:
    fields:
      - origin
      - celestial_memory
      - current_phase
      - phase_confidence
      - awakening_fragments
    owner: narrative_engine
    rule: Identity is revealed through play and evidence, never fixed as static destiny.
  branch_context:
    fields:
      - current_leaf_branch_ref
      - branch_generation_context_refs
      - branch_event_refs
    owner: runtime_cosmology_contracts_and_narrative_engine
    rule: Branch refs record player-specific reality context without pre-generating branch trees.
  resonance_channels:
    fields:
      - realm_attunement
      - wolf_resonance
      - bloodline_resonance
    owner: narrative_engine_with_realm_engine_inputs
    rule: Resonance changes access, pressure, and interpretation without changing fixed cosmology.
  continuity_refs:
    fields:
      - narrative_memory_refs
      - unresolved_tension_refs
      - active_worldstate_delta_refs
      - future_generation_bias_refs
    owner: narrative_engine
    rule: Consequence persists through references; presentation layers may not soft-reset it.
  perception_posture:
    fields:
      - perception_state_ref
      - active_realm_form
    owner: perception_engine_with_realm_engine_inputs
    rule: Perception may diverge per player but must not rewrite shared world truth.
  provenance:
    fields:
      - cosmic_pattern_snapshot_ref
      - diagnostic_ref
      - generation_plan_ref
      - source_ash_refs
      - axiom_diagnostic_refs
      - pattern_vector_refs
      - existence_potential_ref
    owner: ash_pattern_system_component_and_ywe_contracts
    rule: Meaningful state updates require ASH-derived provenance and diagnostics.

update_pipeline:
  - step: capture_player_action
    input: PlayerActionTrace
    output: candidate_context_change
  - step: classify_branch_event
    input: player_action_and_context
    output: BranchEvent_or_DiagnosticNoOp
  - step: resolve_branch_context
    input: BranchEvent
    output: BranchGenerationContext
  - step: apply_runtime_delta
    input: PlayerRuntimeStateDelta
    output: PlayerRuntimeState
  - step: publish_generation_context_ref
    input: PlayerRuntimeState
    output: YWEGenerationContextPacket.player_runtime_state_ref

rejected_mutations:
  - mutation: host_adapter_direct_write
    reason: Host adapters materialize approved output but do not author YWE truth.
  - mutation: independent_random_generation
    reason: Runtime state changes must remain downstream of ASH-derived context and diagnostics.
  - mutation: ash_math_mutation
    reason: Player actions influence YWE context only.
  - mutation: shared_world_truth_rewrite
    reason: Player-specific state cannot overwrite shared cosmological or world truth.
  - mutation: fixed_destiny_assignment
    reason: Identity is revealed through play and must remain choice-shaped.
  - mutation: branch_without_branch_event
    reason: Leaf branch reality refs require BranchEvent or diagnostic evidence.

validation_markers:
  - PlayerRuntimeState
  - PlayerRuntimeStateDelta
  - player_runtime_state_ref
  - current_leaf_branch_ref
  - branch_generation_context_refs
  - branch_event_refs
  - identity_reveal_policy
  - can_influence_generation_context
  - may_mutate_ash_math
  - may_rewrite_shared_world_truth
  - may_mutate_base_world_ontology
  - host_adapter_may_author
