version: "1.0"

canonical_ash_derivation:
  required_input: CosmicPatternSnapshot
  required_player_state: PlayerState
  required_state_identity: StateIdentity
  required_diagnostic: DiagnosticEnvelope
  required_plan: GenerationPlan
  independent_random_generation_allowed: false

compatibility_aliases:
  RealmIdentity: StateIdentity
  realm_id: vertex_id

required_outputs:
  - CharacterSeedManifest
  - IdentityPressureVector
  - ProgressionDelta
  - PlayerStateDelta

creation_rules:
  - character_seed_manifest_requires_source_ash_refs
  - identity_pressure_vector_is_revealed_through_play
  - class_first_creation_is_not_authoritative
  - destiny_must_not_be_locked_at_creation
  - wolf_balance_is_not_good_evil_or_zero_sum

progression_rules:
  - progression_delta_requires_diagnostic_ref
  - progression_delta_requires_generation_plan_ref
  - progression_delta_routes_to_worldstate_delta_packet
  - player_state_delta_preserves_source_ash_refs

validation_rules:
  - reject_character_creation_without_cosmic_pattern_snapshot
  - reject_character_creation_without_diagnostic_envelope
  - reject_character_creation_without_generation_plan
  - reject_untraced_progression_delta
