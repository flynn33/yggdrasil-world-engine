version: "1.0.0"
status: active_contract
contract_id: ywe.core.narrative_engine.quest_npc_lore_generation_rules.v1
phase: 12
phase_name: Quest, NPC, and Lore Generation

meta:
  system: quest_npc_lore_generation_rules
  purpose: Defines how ASH-derived generation requests become quest chains, NPC manifests, NPC memory deltas, lore archive records, myth records, and social distribution deltas without rewriting ASH math, base ontology, or accepted worldstate.
  schema: data/schemas/quest_npc_lore_generation_schema.json
  upstream_dependencies:
    - PlayerRuntimeState
    - LeafBranchReality
    - BranchEvent
    - WorldstateDeltaPacket
    - LocationMutationState
    - LocationMutationDelta
    - FutureGenerationBiasUpdate
    - YWEGenerationContextPacket
    - ASHUpstreamGenerationEnvelope
    - YWEInterpretationPacket

global_invariants:
  - ASH Cosmological Model remains the upstream foundation for YWE and its systems.
  - ASH Pattern System remains a YWE component for diagnostics, pattern integrity, recovery, containment, conformance, code resilience, and update/patch stability.
  - Quest, NPC, and lore generation consumes ASH-derived context through YWEGenerationContextPacket and YWEInterpretationPacket.
  - Quest, NPC, and lore generation must preserve source_ash_refs, diagnostic_ref, generation_plan_ref, ywe_generation_context_packet_ref, and worldstate_delta_refs.
  - Quest chains must expose multiple lawful completion modes through CompletionModeSet.minimum_mode_count >= 2.
  - NPC claims, faction claims, and myth variants are interpretive layers unless backed by an accepted WorldstateDeltaPacket.
  - Lore archive may record locked canon, worldstate occurrence, myth variant, faction claim, NPC claim, or perception overlay layers, but generated lore may not overwrite locked canon.
  - MythRecord is retrospective interpretation of worldstate-backed consequence and may not rewrite factual world truth.
  - Host adapters may materialize approved manifests but may not author QuestChainManifest, NPCManifest, LoreArchiveRecord, MythRecord, or SocialDistributionDelta truth.

ash_asp_core_math_rebuild_addendum:
  authority: YWE_ASP_CORE_MATH_REBUILD_PACKAGE
  math_basis: F2^9 full-state ASH vector with fixed 16 canonical codewords
  transition_semantics: "x' = x XOR c"
  required_packets:
    - CosmicPatternSnapshot
    - DiagnosticEnvelope
    - GenerationPlan
    - SourceASHRefs
  provenance_fields:
    - cosmic_pattern_snapshot_ref
    - diagnostic_ref
    - generation_plan_ref
    - source_ash_refs
    - ywe_generation_context_packet_ref
    - worldstate_delta_refs
  boundary_rule: Generation planning may guide materialization but must not author ASH truth or YWE domain truth.

pipeline:
  - step: 1
    name: assemble_phase_12_generation_request
    inputs:
      - PlayerRuntimeState
      - BranchEvent
      - WorldstateDeltaPacket
      - LocationMutationState
      - FutureGenerationBiasUpdate
      - YWEGenerationContextPacket
    emits:
      - QuestGenerationRequest
    required_context:
      - player_runtime_state_ref
      - current_leaf_branch_ref
      - worldstate_delta_refs
      - future_generation_bias_update_refs
      - source_ash_refs
      - diagnostic_ref
      - generation_plan_ref

  - step: 2
    name: request_ash_governed_manifest_plan
    inputs:
      - QuestGenerationRequest
      - YWEGenerationContextPacket
    requires:
      - ASHUpstreamGenerationEnvelope
      - YWEInterpretationPacket
    emits:
      - SystemManifestExchange
    forbidden:
      - independent_random_quest_template
      - npc_without_pattern_provenance
      - lore_without_worldstate_or_myth_context

  - step: 3
    name: emit_phase_12_manifest
    inputs:
      - SystemManifestExchange
      - YWEInterpretationPacket
    emits:
      - QuestChainManifest
      - NPCManifest
      - LoreArchiveRecord
      - MythSeedCandidate
      - MythRecord
      - SocialDistributionDelta
    requires:
      - source_ash_refs
      - diagnostic_ref
      - generation_plan_ref
      - ywe_generation_context_packet_ref
      - authority_boundary

  - step: 4
    name: resolve_quest_and_social_consequence
    inputs:
      - QuestChainManifest
      - NPCManifest
      - LoreArchiveRecord
      - MythRecord
      - player_choice
    emits:
      - QuestResolutionPayload
      - NPCMemoryDelta
      - WorldstateDeltaPacket
      - LocationMutationDelta
      - FutureGenerationBiasUpdate
    rule: Resolution remains downstream of Phase 11 worldstate and location mutation. New persistence must route through WorldstateDeltaPacket or DiagnosticNoOp.

quest_generation_rules:
  required_records:
    - QuestGenerationRequest
    - QuestChainManifest
    - StageManifest
    - CompletionModeSet
    - QuestResolutionPayload
  required_boundaries:
    - quest_must_offer_multiple_completion_modes
    - may_create_independent_random_content_false
    - generation_plan_ref_required_before_manifest
  mode_policy:
    minimum_mode_count: 2
    allowed_mode_kinds:
      - reveal
      - conceal
      - contain
      - reconcile
      - sacrifice
      - defer
    rule: A quest may prefer one mode through context pressure, but it must not collapse the contract into a single scripted outcome.
  consequence_policy:
    quest_resolution_payload_requires:
      - worldstate_delta_packet_ref
      - location_mutation_delta_refs
      - future_generation_bias_update_ref
      - npc_memory_delta_refs
      - lore_archive_record_refs
      - myth_record_refs

npc_generation_rules:
  required_records:
    - NPCManifest
    - RelationshipVector
    - TruthFunction
    - PersistenceState
    - NPCMemoryDelta
  claim_layers:
    npc_claim_only:
      may_be_known_by_npc: true
      may_rewrite_shared_world_truth: false
    faction_claim_only:
      may_influence_social_distribution: true
      may_rewrite_shared_world_truth: false
    branch_local_claim:
      requires_current_leaf_branch_ref: true
      may_escape_branch_without_worldstate_delta: false
    worldstate_backed_fact:
      requires_worldstate_delta_packet_ref: true
      still_may_not_rewrite_ash_math: true
  persistence_policy:
    append_only: true
    memory_delta_requires_resolution_payload: true
    relationship_change_requires_worldstate_delta_packet_ref: true

lore_generation_rules:
  required_records:
    - LoreArchiveRecord
    - LoreRecordVariant
    - VisibilityScope
  allowed_layers:
    - locked_canon
    - worldstate_occurrence
    - myth_variant
    - faction_claim
    - npc_claim
    - perception_overlay
  layer_policy:
    locked_canon:
      may_be_referenced: true
      may_be_overwritten_by_generation: false
    worldstate_occurrence:
      source: WorldstateDeltaPacket
      requires_diagnostic_ref: true
    myth_variant:
      source: MythRecord
      must_remain_interpretation: true
    faction_claim:
      source: FactionTopologyState
      must_not_be_factual_substrate: true
    npc_claim:
      source: NPCManifest
      must_not_be_factual_substrate: true
    perception_overlay:
      source: PerceptionStateRecord
      must_not_rewrite_shared_world_truth: true
  visibility_policy:
    endgame_truth_protection: true
    progression_constraints_required: true
    realm_constraints_allowed: true

myth_generation_rules:
  required_records:
    - MythSeedCandidate
    - MythRecord
    - MythLine
    - SocialDistributionDelta
  seed_policy:
    requires_source_worldstate_delta_ref: true
    requires_source_quest_resolution_payload_ref: true
    myth_threshold_may_create_candidate: true
    myth_threshold_may_rewrite_fact: false
  distribution_policy:
    propagation_scope:
      - player_local
      - leaf_branch
      - realm_local
      - shared_world
    social_distribution_delta_requires_worldstate_delta_packet_ref: true
    faction_versions_may_disagree: true
    factual_world_truth_rewrite_allowed: false

rejection_cases:
  - quest_generated_without_source_ash_refs
  - quest_chain_manifest_with_minimum_mode_count_less_than_2
  - npc_manifest_without_truth_function
  - npc_memory_delta_without_resolution_payload
  - npc_claim_promoted_to_shared_world_truth_without_worldstate_delta_packet_ref
  - lore_archive_record_overwrites_locked_canon
  - lore_variant_treats_myth_or_faction_claim_as_factual_substrate
  - myth_record_rewrites_factual_world_truth
  - social_distribution_delta_without_worldstate_delta_packet_ref
  - host_adapter_authors_quest_npc_lore_truth

validation_markers:
  - QuestGenerationRequest
  - QuestChainManifest
  - StageManifest
  - CompletionModeSet
  - QuestResolutionPayload
  - NPCManifest
  - NPCMemoryDelta
  - RelationshipVector
  - TruthFunction
  - PersistenceState
  - LoreArchiveRecord
  - LoreRecordVariant
  - VisibilityScope
  - MythSeedCandidate
  - MythRecord
  - SocialDistributionDelta
  - WorldstateDeltaPacket
  - LocationMutationDelta
  - FutureGenerationBiasUpdate
  - source_ash_refs
  - diagnostic_ref
  - generation_plan_ref
  - ywe_generation_context_packet_ref
  - worldstate_delta_refs
