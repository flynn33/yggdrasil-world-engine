version: "0.2"

meta:
  system: faction_topology_state
  purpose: >
    Defines the canonical state surface for factions, cults, houses, orders,
    claimant networks, reform currents, splinter groups, and collective power
    relations inside YWE. This schema stabilizes how relational world structure
    is represented so worldstate consequence, myth pressure, prophecy pressure,
    NPC synthesis, quest generation, and perception overlays all read from the
    same social topology instead of inventing local faction logic.
  doctrine:
    - faction_topology_is_relational_world_structure_not_flavor_lore
    - factions_are_collective_pattern_bearers_not_only_reputation_buckets
    - topology_must_preserve_legitimacy_claim_memory_and_conflict_structure
    - faction_state_must_be_usable_by_runtime_and_persistent_consequence_layers
    - myth_prophecy_and_perception_may_reframe_factions_without_rewriting_core_topology
    - schism_reform_and_succession_are_first_class_state_changes_not_text_notes
    - topology_changes_must_follow_pattern_and_consequence_not_arbitrary_simulation_drift

position_in_stack:
  conceptual_order:
    - cosmology_engine
    - realm_engine
    - ash_pattern_engine
    - narrative_engine
    - quest_engine
    - worldstate_delta_rules
    - faction_topology_state
    - myth_engine
    - prophecy_engine
    - perception_engine
  notes:
    - faction topology is downstream of core truth and live consequence
    - faction topology feeds future quest pressure, myth legitimacy, prophecy carriers, and perception overlays
    - faction topology is a state surface, not an independent generator of meaning

core_concepts:
  definitions:
    faction:
      description: >
        Any durable organized collective that can hold doctrine, legitimacy,
        memory, claims, resources, obligations, and patterned social action.
    faction_topology:
      description: >
        The living relational map of collective actors, subgroups, alliances,
        rivalries, dependencies, contested claims, and structural instability.
    faction_node:
      description: >
        A single collective actor represented as a durable social node.
    faction_edge:
      description: >
        A meaningful relation between two faction nodes such as alliance,
        patronage, rivalry, doctrinal conflict, infiltration, oath-bond,
        inheritance claim, or open war.
    legitimacy:
      description: >
        The degree to which a faction's authority, claim, role, or doctrine is
        accepted as rightful within a given scope.
    doctrine_profile:
      description: >
        The faction's active worldview, priorities, transmission style, and
        interpretive habits.
    schism:
      description: >
        A structural split in a faction where shared authority, memory,
        doctrine, or succession no longer holds.
    reform_current:
      description: >
        A pressure stream within or around a faction seeking transformation
        without yet becoming a separate node.
    claimant_network:
      description: >
        A set of actors, lineages, offices, or factions asserting rights to a
        place, title, lineage, archive, relic, or social role.
    topology_update:
      description: >
        A persistent change packet that alters faction nodes, edges, claims,
        legitimacy, doctrine, or activation state.

organization_types:
  supported:
    - order
    - house
    - cult
    - covenant
    - guild
    - wardenship
    - sanctuary_network
    - lineage_circle
    - archive_circle
    - reform_movement
    - claimant_bloc
    - insurgent_cell
    - pilgrim_band
    - mercantile_union
    - mixed_collective
  notes:
    - organization_type is descriptive and does not alone determine legitimacy or morality
    - multiple organization types may share similar power profiles while differing in doctrine or claims

scope_model:
  topology_scopes:
    - local
    - regional
    - shard_wide
    - bloodline_restricted
    - secret_circle
    - cross_realm_relevance
  notes:
    - a faction may operate at one scope while its myths or prophecy influence spread wider
    - scope changes should be explicit state changes, not implicit assumptions

state_domains:
  represented_domains:
    - faction_identity
    - faction_structure
    - faction_legitimacy
    - faction_doctrine
    - faction_resources
    - faction_presence
    - faction_relations
    - claimant_pressure
    - schism_and_reform
    - archive_and_ritual_control
    - myth_alignment
    - prophecy_alignment
    - npc_affiliation_surface
    - perception_overlay_hooks

core_schema:
  FactionTopologyState:
    topology_id: string
    shard_or_scope_id: string
    cycle_marker: integer
    active_faction_nodes: [FactionNode]
    active_faction_edges: [FactionEdge]
    active_claim_records: [ClaimRecord]
    active_reform_currents: [ReformCurrent]
    active_succession_tracks: [SuccessionTrack]
    topology_flags: [string]
    instability_profile:
      schism_risk: float
      succession_risk: float
      war_risk: float
      infiltration_risk: float
      doctrinal_volatility: float
    last_update_sources: [string]

  FactionNode:
    faction_id: string
    display_name: string
    organization_type: string
    status: active | dormant | fragmented | suppressed | exiled | absorbed | hidden
    public_visibility: secret | obscured | known_local | known_regional | known_shard
    scope: string
    primary_archetype_bias: [string]
    secondary_archetype_bias: [string]
    doctrine_profile:
      core_doctrines: [string]
      interpretive_axes: [string]
      truth_style: string
      prophecy_style: string
      myth_style: string
      secrecy_style: string
    legitimacy_profile:
      local: float
      regional: float
      ritual: float
      bloodline: float
      archival: float
      coercive: float
      popular: float
    resource_profile:
      manpower: float
      ritual_capacity: float
      archive_access: float
      site_control: float
      mobility: float
      wealth_or_supply: float
      omen_sensitivity: float
    presence_profile:
      strongholds: [string]
      active_regions: [string]
      hidden_sites: [string]
      thin_veil_relevance: [string]
    alignment_profile:
      realm_biases: [string]
      white_wolf_bias: float
      dark_wolf_bias: float
      bloodline_affinities: [string]
    social_profile:
      member_count_band: tiny | small | moderate | large | vast
      recruitment_mode: [string]
      transmission_mode: [string]
      public_face_roles: [string]
      internal_roles: [string]
    risk_profile:
      schism_risk: float
      corruption_risk: float
      exposure_risk: float
      extinction_risk: float
      cooption_risk: float
    linkage_profile:
      linked_myth_lines: [string]
      linked_prophecy_lines: [string]
      linked_artifacts: [string]
      linked_sites: [string]
      linked_claims: [string]
    persistence_profile:
      can_fragment: boolean
      can_absorb_others: boolean
      can_go_underground: boolean
      historical_weight: float
      recurrence_weight: float
    notes_tags: [string]

  FactionEdge:
    edge_id: string
    source_faction_id: string
    target_faction_id: string
    relation_type: string
    status: active | tense | broken | covert | frozen | escalated
    reciprocity: mutual | asymmetric | disputed
    visibility: secret | internal | local_public | regional_public | shard_public
    strength: float
    hostility: float
    trust: float
    dependency: float
    legitimacy_transfer: float
    doctrinal_resonance: float
    claim_overlap: float
    linked_sites: [string]
    linked_myth_lines: [string]
    linked_prophecy_lines: [string]
    last_changed_by: [string]
    change_pressure_tags: [string]

  ClaimRecord:
    claim_id: string
    claim_type: title | site | bloodline | office | archive | relic | sanctuary | succession | interpretation_authority
    target_id: string
    claimant_faction_ids: [string]
    supporting_bloodlines: [string]
    supporting_artifacts: [string]
    supporting_archives: [string]
    public_visibility: secret | internal | local_public | regional_public | shard_public
    legitimacy_weight: float
    contestation_level: float
    violence_risk: float
    ritual_relevance: float
    succession_relevance: float
    myth_dependence: float
    prophecy_dependence: float
    status: dormant | active | contested | escalating | settled | suppressed
    resolution_hooks: [string]

  ReformCurrent:
    reform_id: string
    host_faction_id: string
    current_status: latent | active | expanding | suppressed | seceded | absorbed
    desired_direction: purify | liberalize | centralize | decentralize | reveal | conceal | militarize | reconcile | reclaim | found_new_branch
    support_strength: float
    leadership_visibility: secret | internal | local_public | regional_public
    doctrinal_divergence: float
    legitimacy_pressure: float
    schism_probability: float
    linked_npc_ids: [string]
    linked_myth_lines: [string]
    linked_prophecy_lines: [string]

  SuccessionTrack:
    succession_id: string
    faction_id: string
    office_or_role: string
    current_state: stable | disputed | vacant | hidden | broken | ceremonial_only
    claimant_ids: [string]
    bloodline_relevance: float
    archive_relevance: float
    ritual_confirmation_relevance: float
    mythic_weight: float
    prophecy_weight: float
    violence_risk: float
    resolution_pressure: float
    linked_claim_ids: [string]

relation_types:
  supported:
    - alliance
    - ceasefire
    - rivalry
    - open_conflict
    - covert_conflict
    - patronage
    - vassalage
    - protection_compact
    - archive_sharing
    - ritual_dependency
    - trade_dependency
    - bloodline_alignment
    - claimant_overlap
    - infiltration
    - doctrinal_affinity
    - doctrinal_conflict
    - sanctuary_access
    - succession_support
    - myth_coownership
    - prophecy_competition
    - mutual_suspicion
    - absorption_pressure
    - schism_branch_relation
  rules:
    - open_conflict and alliance may not both be primary active relation states without explicit contested layering
    - infiltration is normally asymmetric and at least partially hidden
    - schism_branch_relation should be used when a daughter branch still shares memory or claim structure with its origin node
    - myth_coownership and prophecy_competition may coexist and should not be simplified into one reputation number

faction_generation_and_update_inputs:
  required:
    - worldstate_delta_packets
    - active_pattern_snapshot
    - player_narrative_snapshot
    - npc_affiliation_updates
    - local_world_condition
    - myth_pressure_updates
    - prophecy_pressure_updates
  optional:
    - authored_faction_registry
    - bloodline_registry
    - artifact_resonance_updates
    - perception_overlay_requests
    - site_activation_state

update_pipeline:
  steps:
    - collect_relevant_deltas
    - identify_affected_faction_nodes
    - identify_affected_claim_records
    - score_legitimacy_shift
    - score_relation_shift
    - score_reform_or_schism_pressure
    - score_succession_pressure
    - apply_visibility_changes
    - apply_presence_changes
    - apply_claim_state_changes
    - emit_topology_updates
    - validate_against_guardrails
    - publish_topology_state

legitimacy_rules:
  legitimacy_axes:
    - local
    - regional
    - ritual
    - bloodline
    - archival
    - coercive
    - popular
  doctrine:
    - legitimacy_is_multiaxial_not_one_scalar_value
    - a faction_may_gain_ritual_legitimacy_while_losing_popular_legitimacy
    - bloodline_and_archival_legitimacy_may_conflict_with_local_acceptance
    - myth_and_prophecy_may_bias_legitimacy_but_do_not_replace_structural_basis
  modifiers:
    if_faction_controls_site_of_power:
      ritual_bonus: 0.1_to_0.25
    if_public_myth_line_supports_claim:
      popular_or_local_bonus: 0.05_to_0.2
    if_archive_disproof_emerges:
      archival_penalty: 0.1_to_0.3
    if_prophecy_reading_is_contested:
      volatility_bonus: 0.05_to_0.2
    if_player_action_publicly_reorders_power:
      local_and_regional_shift: 0.1_to_0.35

claim_rules:
  doctrine:
    - claims_are_structural_pressures_not_only_dialogue_text
    - contested_claims_should_influence_quest_selection_npc_alignment_and myth framing
    - claims_may_remain_dormant_until_site_bloodline_archive_or_prophecy pressure rises
    - settled_claims_may_leave residual grievance or secret dissent
  typical_claim_sources:
    - bloodline_revelation
    - archive_discovery
    - relic_recovery
    - ritual_confirmation
    - mythic_vindication
    - public_victory
    - succession_vacancy
    - sanctuary_restoration

schism_and_reform_rules:
  triggers:
    - doctrinal_divergence_above_threshold
    - unresolved_succession_pressure
    - incompatible_claim_outcomes
    - prophecy_interpretation_split
    - mythic_blame_or_credit_split
    - archive_disclosure
    - external_infiltration_pressure
    - repeated_player_alignment_with_dissenting_branch
  thresholds:
    soft_reform_threshold: 0.35
    hard_reform_threshold: 0.55
    schism_threshold: 0.72
  outputs:
    - reform_current_activation
    - edge_status_change
    - daughter_branch_creation_request
    - doctrine_profile_divergence
    - legitimacy_redistribution
  notes:
    - not every disagreement should create a new faction node
    - schism should create durable topology change when it occurs
    - reform and schism are different states and should not be collapsed

presence_rules:
  doctrine:
    - faction_presence_is_more_than_map_control
    - hidden_sites_archive_access_and_ritual_routes_are_valid_presence_surfaces
    - perception_layers_may_reveal_different_presence_aspects_without_rewriting_node_truth
  presence_vectors:
    - public_institutions
    - hidden_cells
    - shrine_keepers
    - archive_guardians
    - caravan_routes
    - bloodline_hosts
    - ritual_networks
    - site_of_power_control
    - sanctuary_stewardship
    - rumor_brokers

npc_affiliation_rules:
  doctrine:
    - npc_affiliation_should_read_from_topology_state_not_invent_private_faction_law
    - one_npc_may_touch_multiple_factions_through_dependence_history_or_covert_alignment
    - public_affiliation_and_true_affiliation_may_differ
  minimum_fields_to_bind:
    - faction_id
    - role_in_faction
    - visibility_of_affiliation
    - trust_weight
    - doctrinal_fit
    - claim_relevance
    - betrayal_or_dissent_risk

myth_and_prophecy_integration:
  myth_hooks:
    - factions_act_as_myth_carriers_distorters_and legitimizers
    - myth_line_support_may_strengthen_or_weaken_claims
    - faction_versions_of_myth_should_bias_topology_without_replacing_structural_truth
  prophecy_hooks:
    - factions_may_hasten_contain_deny_or exploit prophecy lines
    - prophecy_alignment_should affect reform succession and mobilization pressure
    - prophecy_competition_between_factions_should be an explicit edge surface when important

perception_integration:
  doctrine:
    - perception_may_change_what_faction_signs_agents_sites_or_symbols_are_visible
    - perception_must_not_silently_rewrite_faction_ownership_or_legitimacy_truth
    - a_hidden_cult_market_and_a_normal_market_may_share_location_while_differing_in_visibility_layer
  overlay_hooks:
    - visible_banners
    - hidden_agents
    - shrine_symbols
    - doctrinal_text_variants
    - restricted_vendor_presence
    - secret_processions
    - claimant_markers

topology_update_packet_schema:
  FactionTopologyUpdatePacket:
    update_id: string
    source_event_id: string
    source_delta_ids: [string]
    affected_faction_ids: [string]
    affected_edge_ids: [string]
    affected_claim_ids: [string]
    update_type: node_change | edge_change | claim_change | reform_change | succession_change | presence_change
    strength: float
    persistence: transient | lingering | durable | historical
    visibility: secret | internal | local_public | regional_public | shard_public
    payload_tags: [string]
    validation_tags: [string]

validation_rules:
  hard_failures:
    - faction_state_rewrites_cosmology
    - faction_state_rewrites_realm_ontology
    - myth_or_prophecy_claim_used_as_raw_fact_without_structural_basis
    - perception_overlay_used_to_change_core_topology_truth
    - schism_created_without_any_legitimacy_or_doctrinal_basis
    - claim_resolution_without_source_pressure_or_consequence
  soft_failures:
    - all_legitimacy_collapsed_to_single_score
    - all_relations_collapsed_to_friend_or_enemy
    - no_hidden_or_contested_state_support
    - no_claim_or_succession_surface_for_relevant_factions
    - topology_changes_without_myth_or_prophecy_hooks_when_symbolically_major

anti_flatness_rules:
  - do_not_model_factions_as_simple_reputation_bars
  - do_not_treat_every_conflict_as_open_war
  - do_not_flatten_doctrine_claim_and_legitimacy_into_one_field
  - do_not_force_public_visibility_for_every_structurally_real_faction
  - do_not_assume_one_official_version_of_collective_memory
  - do_not_create_new_faction_nodes_when_an_edge_or_reform_current_would_do
  - do_not_use_faction_topology_to_replace_npc_level_relational_nuance

example_topology_patterns:
  claimant_crisis:
    description: >
      A seat, site, relic, or lineage right is contested by multiple factions,
      increasing claim_overlap, succession_pressure, and violence_risk.
    likely_outputs:
      - succession_track_activation
      - doctrinal_conflict_edge
      - myth_vindication_competition
      - player_mediation_or_escalation_hooks

  controlled_schism:
    description: >
      A reform current exceeds hard threshold and becomes a daughter branch,
      preserving some memory and claim links while breaking doctrine unity.
    likely_outputs:
      - schism_branch_relation_edge
      - legitimacy_redistribution
      - hidden_loyalty_npcs
      - prophecy_interpretation_split

  hidden_capture:
    description: >
      A visible faction appears stable while a covert faction or cult has
      asymmetric infiltration and claim leverage.
    likely_outputs:
      - infiltration_edge
      - mismatched_public_and_true_affiliation
      - perception_overlay_hooks
      - secret_circle_visibility states

  sanctuary_compact:
    description: >
      Multiple factions maintain tense alignment through shared dependence on a
      sanctuary, veil site, or archive that none can safely destroy.
    likely_outputs:
      - protection_compact_edge
      - ritual_dependency_edge
      - fragile_ceasefire
      - myth_coownership

implementation_notes:
  recommended_repo_locations:
    canonical_schema: data/factions/faction_topology_state_schema.yaml
    supporting_registry: data/factions/faction_registry.yaml
    supporting_claim_registry: data/factions/claim_registry.yaml
    supporting_notes: docs/architecture/FACTION_TOPOLOGY_STATE_NOTES.md
  upstream_consumers:
    - npc_synthesis_rules
    - quest_chain_templates
    - ash_runtime_generation_flow
    - worldstate_delta_rules
  downstream_consumers:
    - myth_emergence_rules
    - prophecy_activation_rules
    - perception_overlay_rules
    - future_faction_engine_or_civilization_engine
  notes:
    - if the repo still lacks a dedicated data/factions path, Codex should create it rather than forcing faction topology into unrelated folders
    - this schema is agnostic design truth and should not be rewritten around one engine's runtime model
