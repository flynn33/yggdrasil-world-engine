relation_weights:
  compatible: 0.75
  friction: -0.35
  contradiction: -1.0
  neutral: 0.0

derivation_rules:
  precedence: [contradiction, friction, compatibility, neutral]
  semantics:
    compatible: Reinforcing pressure that strengthens lawful co-selection.
    friction: Tension that is valid only when expressed deliberately in downstream systems.
    contradiction: Structurally unstable pairing that requires explicit higher-order design handling.
  note: >
    This file is a normalized relationship view. Family registries remain the
    primary source of canonical record meaning and downstream affinity hints.

