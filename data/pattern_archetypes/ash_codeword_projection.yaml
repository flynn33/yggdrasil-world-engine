downstream_rule:
  allowed: >
    Downstream modules may interpret active codeword pressure into quest,
    artifact, creature, myth, prophecy, perception, or narrative plans.
  forbidden: >
    Downstream modules may not define archetype, compatibility, or generation
    truth without an ASH state, codeword transition, diagnostic envelope, and
    GenerationPlan boundary.
