manifest_version: "0.2"
manifest_id: mcm_ywe_module_quest_engine
module_id: com.ywe.module.quest-engine
module_name: YWE Quest Engine
module_classification: feature_module
authority_class: manifestation_logic
owned_scope:
  - quest
purpose: >
  Manifests playable quest chains from upstream pattern and narrative state
  without owning cosmology, realm ontology, or independent meaning generation.
activation_state: available
activation_priority: 60
dependency_order_index: 60
provides_capabilities:
  - capability_id: provide_quest_chain_manifest
    scope: quest
    description: Emits staged quest-chain structures and branchable resolution surfaces.
    truth_sensitive: true
  - capability_id: provide_quest_consequence_signals
    scope: quest
    description: Emits quest resolution signals for consequence routing and downstream persistence.
    truth_sensitive: true
requires_capabilities:
  - capability_id: provide_cosmic_pattern_snapshot
    scope: ash_pattern
    dependency_strength: hard_required
    rationale: Quest meaning must derive from ASH pattern state.
  - capability_id: provide_player_narrative_snapshot
    scope: narrative
    dependency_strength: hard_required
    rationale: Quest manifestation must reflect player-specific interpretation and history.
  - capability_id: provide_realm_mechanics_profile
    scope: realm
    dependency_strength: preferred
    rationale: Realm-law context shapes lawful quest emergence and traversal.
consumes_state:
  - state_id: CosmicPatternSnapshot
    required: true
    notes: Symbolic pressure input for quest generation.
  - state_id: PlayerNarrativeSnapshot
    required: true
    notes: Player-specific narrative memory and unresolved-tension input.
  - state_id: RealmMechanicsProfile
    required: false
    notes: Realm-law input for lawful quest placement and threshold handling.
emits_state:
  - state_id: QuestChainManifest
    persistence: active_until_resolved
    notes: Playable quest structure emitted for downstream realization.
  - state_id: WorldstateDeltaPacket
    persistence: post_resolution
    notes: Consequence packet emitted after quest resolution.
non_delegable_responsibilities:
  - responsibility_id: ndr_quest_meaning_binding
    description: Owns the interpretive binding between templates, patterns, and player narrative state.
    rationale: External engines may realize quests but may not author quest meaning.
delegable_compatible_responsibilities:
  - responsibility_id: dcr_scene_and_objective_realization
    description: External environments may realize quest spaces, objectives, and encounter presentation.
    delegation_rule: delegable_with_guardrails
    guardrails:
      - realization_layers_must_follow_emitted_quest_chain_manifest
      - realization_layers_must_not_bypass_worldstate_delta_emission
  - responsibility_id: dcr_quest_ui_presentation
    description: Host UI may present logs, objective state, and branch summaries.
    delegation_rule: presentation_only
    guardrails:
      - presented_objectives_must_not_invent_new_meaningful_outcomes
suppression_conditions:
  - condition_id: sc_no_quest_context
    reason: runtime_context_not_required
    description: Module may remain dormant when current runtime scope does not require quest manifestation.
  - condition_id: sc_impl_not_ready
    reason: implementation_not_ready
    description: Canonical declaration exists before runtime code lands.
incompatible_with: []
compatible_external_capabilities:
  - capability_class: scene_realization
    constraints:
      - quest_scene_realization_is_downstream_only
  - capability_class: encounter_presentation
    constraints:
      - encounter_presentation_must_follow_emitted_quest_manifest
  - capability_class: ui_presentation
    constraints:
      - ui_layers_must_reflect_emitted_branch_state_only
invariant_guardrails:
  - guardrail_id: ig_no_independent_random_meaning
    description: Quest generation may not invent meaningful content independently of ASH and narrative inputs.
  - guardrail_id: ig_quests_emit_consequence
    description: Completed quest chains must continue to emit consequence signals for downstream persistence.
validation_requirements:
  - validation_id: vr_upstream_dependencies_present
    description: Verify ASH and narrative dependencies remain present before quest activation.
  - validation_id: vr_templates_do_not_replace_truth
    description: Verify quest templates remain manifestation structures rather than independent truth authors.
notes:
  - Companion to modules/quest_engine/forsetti_module_manifest.template.json.
