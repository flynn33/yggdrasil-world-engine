manifest_version: "0.2"
manifest_id: mcm_ywe_module_creature_engine
module_id: com.ywe.module.creature-engine
module_name: YWE Creature Engine
module_classification: feature_module
authority_class: manifestation_logic
owned_scope:
  - creature
purpose: >
  Manifests creatures and encounter hooks from upstream pattern, realm, and
  narrative state while preserving symbolic meaning and consequence semantics.
activation_state: available
activation_priority: 100
dependency_order_index: 100
provides_capabilities:
  - capability_id: provide_creature_manifest
    scope: creature
    description: Emits creature manifestation packages and encounter-relevant symbolic context.
    truth_sensitive: true
  - capability_id: provide_encounter_hooks
    scope: creature
    description: Emits encounter hooks and follow-on consequence signals for realized creatures.
    truth_sensitive: true
requires_capabilities:
  - capability_id: provide_cosmic_pattern_snapshot
    scope: ash_pattern
    dependency_strength: hard_required
    rationale: Creature meaning must derive from ASH pattern state.
  - capability_id: provide_realm_mechanics_profile
    scope: realm
    dependency_strength: hard_required
    rationale: Realm-law context governs lawful creature manifestation and boundary behavior.
  - capability_id: provide_player_narrative_snapshot
    scope: narrative
    dependency_strength: hard_required
    rationale: Creature emergence and hostility or aid patterns depend on narrative consequence context.
consumes_state:
  - state_id: CosmicPatternSnapshot
    required: true
    notes: Symbolic pressure input for creature manifestation.
  - state_id: RealmMechanicsProfile
    required: true
    notes: Realm-law context for lawful manifestation and encounter conditions.
  - state_id: PlayerNarrativeSnapshot
    required: true
    notes: Player-specific narrative context for creature salience and response.
emits_state:
  - state_id: CreatureManifest
    persistence: encounter_lifecycle
    notes: Creature manifestation package for downstream embodiment and encounter realization.
  - state_id: WorldstateDeltaPacket
    persistence: post_encounter
    notes: Consequence packet emitted when encounters produce persistent change.
non_delegable_responsibilities:
  - responsibility_id: ndr_creature_symbolic_binding
    description: Owns the mapping from pattern, realm, and narrative pressure into creature meaning and role.
    rationale: External environments may embody creatures but may not author their YWE meaning.
  - responsibility_id: ndr_encounter_consequence_semantics
    description: Owns encounter consequence semantics and downstream state updates.
    rationale: Persistent consequence remains internal YWE truth.
delegable_compatible_responsibilities:
  - responsibility_id: dcr_creature_embodiment
    description: Host environments may realize AI embodiments, animation, and encounter presentation for emitted creatures.
    delegation_rule: delegable_with_guardrails
    guardrails:
      - embodiment_layers_must_follow_emitted_creature_manifest
      - host_layers_must_not_author_new_creature_meaning_outside_emitted_state
suppression_conditions:
  - condition_id: sc_no_creature_context
    reason: runtime_context_not_required
    description: Module may remain dormant when no creature manifestation context is active.
  - condition_id: sc_impl_not_ready
    reason: implementation_not_ready
    description: Canonical declaration exists before runtime implementation is available.
incompatible_with: []
compatible_external_capabilities:
  - capability_class: npc_embodiment
    constraints:
      - npc_embodiment_must_follow_emitted_creature_manifest
  - capability_class: animation
    constraints:
      - animation_layers_are_realization_only
  - capability_class: encounter_presentation
    constraints:
      - encounter_presentation_must_not_rewrite_encounter_consequence_truth
invariant_guardrails:
  - guardrail_id: ig_creatures_are_pattern_derived
    description: Creature manifestation remains downstream of ASH pattern, realm, and narrative inputs.
  - guardrail_id: ig_manifestation_not_standalone_spawn_table
    description: Creature output may not collapse into detached spawn-table generation.
validation_requirements:
  - validation_id: vr_required_inputs_present
    description: Verify ASH, realm, and narrative inputs remain present before creature activation.
  - validation_id: vr_creature_rules_alignment
    description: Verify creature manifestations remain aligned with canonical creature system rules.
notes:
  - Companion to modules/creature_engine/forsetti_module_manifest.template.json.
