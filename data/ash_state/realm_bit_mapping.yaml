version: "1.1"
status: canonical_wrw_projection
profile_id: wrw_reference_profile

canonical_ash_derivation:
  state_space: F2^9
  canonical_spec: core/ash_pattern_engine/canonical/core/ash-state-space.pseudo.md
  codeword_spec: core/ash_pattern_engine/canonical/core/codeword-set.pseudo.md
  state_identity_spec: core/ash_pattern_engine/canonical/core/realm-identity.pseudo.md
  transition_rule: xor_by_codeword
  note: >
    These nine one-hot state anchors are a WRW reference-profile projection
    from named cosmology into full ASH states. They are not an exhaustive
    definition of the 512 ASH states, not the complete meaning of any named
    realm, and not an alternate source of ASH mathematics. No coordinate is
    structurally privileged by the projection.

coordinate_vocabulary:
  structural_coordinate: named_position_b0_through_b8
  coordinate_index: zero_based_integer_0_through_8
  ordinal: one_based_coordinate_index_plus_one
  presentation_order: wrw_divine_core_to_void
  state_identity: complete_9_bit_ash_state_signature
  identity_rule: >
    No Structural Coordinate, Coordinate Index, Ordinal, or presentation order
    is a complete State Identity or establishes algebraic priority.

compatibility_fields:
  bit_index:
    status: deprecated
    canonical_field: coordinate_index
    behavior: exact_numeric_alias
    conflict_behavior: reject_record
  ash_state:
    status: deprecated
    canonical_field: state_identity
    behavior: exact_string_alias
    conflict_behavior: reject_record

