positive:
  complete_foundational_manifest:
    manifest_version: '0.2'
    manifest_id: manifest.structural.fixture
    module_id: fixture.module
    module_name: Structural fixture
    module_classification: core_engine
    authority_class: foundational_truth
    owned_scope:
    - validation
    purpose: Exercise declared manifest structure.
    activation_state: available
    activation_priority: 0
    dependency_order_index: 0
    provides_capabilities:
