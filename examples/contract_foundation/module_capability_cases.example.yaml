      scope: validation
      description: Typed capability record.
      truth_sensitive: true
    requires_capabilities:
    - capability_id: fixture.input
      scope: validation
      dependency_strength: hard_required
      rationale: Typed dependency record.
    non_delegable_responsibilities:
    - responsibility_id: fixture.responsibility
      description: Typed responsibility record.
      rationale: Authority remains with its owner.
    invariant_guardrails:
    - guardrail_id: fixture.guardrail
      description: Typed guardrail record.
    validation_requirements:
    - validation_id: fixture.validation
      description: Typed validation record.
    consumes_state:
    - state_id: fixture.input
      required: true
      notes: Typed input record.
    emits_state:
    - state_id: fixture.output
      persistence: fixture
      notes: Typed output record.
    delegable_compatible_responsibilities:
    - responsibility_id: fixture.presentation
      description: Typed presentation record.
      delegation_rule: presentation_only
      guardrails:
      - fixture.guardrail
    suppression_conditions:
    - condition_id: fixture.condition
      reason: runtime_context_not_required
      description: Typed suppression record.
    incompatible_with:
    - target_module_id: fixture.other
      rationale: Typed incompatibility record.
    compatible_external_capabilities:
    - capability_class: rendering
      constraints:
      - fixture.constraint
    notes:
