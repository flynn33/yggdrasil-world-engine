artifact_type: yaml_descriptor_cases
artifact_version: 1.0.0
description: New descriptor format grammar and meta-reference witnesses. Domain and
  generation semantics are separate contracts.
positive:
  pattern_minimal:
    version: '1.0'
    meta:
      system: ash_pattern_registry_schema
      purpose: Descriptor fixture
    enums:
      record_status:
      - canonical
      cluster_stability:
      - stable
      family:
      - character
      realm:
      - physical
    schema:
      ArchetypeRecord:
        type: map
        required:
        - name
        properties:
          name:
            type: string
          family:
            type: enum
            values_ref: family
          realm:
            type: list
            items_ref: realm
          attributes:
            type: map
            required:
            - label
            properties:
              label:
                type: string
          bias:
            type: float
            range_hint: Annotation only
      ClusterRecord:
        extends: ArchetypeRecord
        additional_required:
        - members
        properties:
          members:
            type: list
            items: string
            min_items: 2
    registry_shape:
      registry_version: string
      families:
        character:
          type: list
          items_ref: ArchetypeRecord
        cluster:
          type: list
          items_ref: ClusterRecord
  module_minimal:
    version: '0.2'
    meta:
      system: module_capability_manifest_schema
      purpose: Descriptor fixture
      doctrine:
      - forsetti_governs_module_lifecycle
      - external_environments_may_realize_but_may_not_author_ywe_truth
    classification_enums:
      module_classification:
      - core_engine
      - feature_module
      dependency_strength:
      - hard_required
      - optional
    core_schema:
      ModuleCapabilityManifest:
        module_classification: core_engine | feature_module
        provides_capabilities:
        - capability_id: string
        requires_capabilities:
        - capability_id: string
          dependency_strength: hard_required | optional
        consumes_state:
        - state_id: string
        emits_state:
        - state_id: string
        non_delegable_responsibilities:
        - responsibility_id: string
        delegable_compatible_responsibilities:
        - responsibility_id: string
        suppression_conditions:
        - condition_id: string
        compatible_external_capabilities:
        - constraints:
          - string
    canonical_validation_rules:
      required_fields:
      - module_classification
      - provides_capabilities
      truth_boundary_rules: []
      dependency_rules: []
      anti_drift_rules: []
